<style>
  :root{
    --navy: #060E22;
    --navy2: #0B1B3D;
    --panel: rgba(255,255,255,0.05);
    --panel-solid: #101F45;
    --panel-2: #172a57;
    --blue: #1E4FD8;
    --blue2: #4E7FFF;
    --red: #D62839;
    --red2: #FF4757;
    --gold: #F4C430;
    --ink: #F4F6FB;
    --ink-dim: rgba(244,246,251,0.6);
    --line: rgba(244,246,251,0.12);
    --danger: #FF4757;
    --star: #E7ECF7;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(214,40,57,0.20), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 5%, rgba(30,79,216,0.22), transparent 55%),
      var(--navy);
    color: var(--ink);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    min-height: 100vh;
  }
  h1,h2,h3{ font-family: 'Tajawal', sans-serif; margin: 0; }
  ::selection{ background: var(--red); color: #fff; }
  [dir="ltr"]{ font-family: 'IBM Plex Sans Arabic', sans-serif; }

  /* ---------- Topbar ---------- */
  .topbar{
    display: flex; align-items:center; justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--line);
    position: sticky; top:0;
    background: rgba(6,14,34,0.78);
    backdrop-filter: blur(10px);
    z-index: 40;
    gap: 14px;
  }
  .brand-wrap{ display:flex; align-items:center; gap:10px; }
  .brand-badge{
    width:34px; height:34px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--blue2), var(--navy2) 70%);
    border: 2px solid var(--red);
    position:relative; flex-shrink:0;
    box-shadow: 0 0 14px rgba(214,40,57,0.5), inset 0 0 8px rgba(255,255,255,0.15);
  }
  .brand-badge::after{
    content:'★'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color: var(--star); font-size:0.85rem;
  }
  .brand{
    font-family:'Bebas Neue','Tajawal',sans-serif;
    font-weight:900; font-size:1.7rem; letter-spacing:3px;
    background: linear-gradient(90deg, var(--red2) 0%, var(--star) 35%, var(--blue2) 65%, var(--red2) 100%);
    background-size: 300% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shineBrand 5s linear infinite;
  }
  @keyframes shineBrand{ to{ background-position: -300% center; } }
  .actions{ display:flex; gap:10px; align-items:center; }

  .btn{
    font-family:'IBM Plex Sans Arabic',sans-serif;
    font-size:0.9rem; padding:10px 20px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--ink);
    transition: all 0.25s ease;
  }
  .btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .btn.primary{
    background: linear-gradient(135deg, var(--red), var(--red2));
    border-color: transparent; color:#fff; font-weight:700;
    box-shadow: 0 4px 18px rgba(214,40,57,0.35);
  }
  .btn.primary:hover{ transform: translateY(-1px); box-shadow: 0 6px 22px rgba(214,40,57,0.45); }
  .btn.blue{
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    border-color: transparent; color:#fff; font-weight:700;
  }
  .btn.ghost:hover{ border-color: var(--ink-dim); }
  .btn.small{ padding:7px 14px; font-size:0.8rem; }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); background: var(--panel); cursor:pointer; color:var(--ink);
    transition: all .2s ease; flex-shrink:0;
  }
  .icon-btn:hover{ border-color: var(--gold); transform: rotate(25deg); }
  .icon-btn svg{ width:19px; height:19px; }

  /* ---------- Hero ---------- */
  .hero{
    padding: 70px 32px 30px;
    text-align:center;
    max-width: 720px;
    margin: 0 auto;
  }
  .hero .eyebrow{
    display:inline-block;
    color: var(--gold);

  /* ---------- Modals ---------- */

  /* ---------- Settings drawer ---------- */
  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(4,8,20,0.6); z-index:70; display:none;
  }

  .drawer{

  /* ---------- Admin ---------- */
  .admin-panel{ max-width: 1000px; margin: 50px auto 100px; padding: 0 32px; }
  .admin-tabs{ display:flex; gap:8px; margin-bottom: 26px; flex-wrap:wrap; }

  table{ width:100%; border-collapse:collapse; background:var(--panel-solid); border:1px solid var(--line); border-radius:12px; overflow:hidden; }

  th{ color:var(--ink-dim); font-weight:500; background:var(--panel-2); }

  }

  footer{ text-align:center; padding:26px; font-size:0.8rem; color:var(--ink-dim); border-top:1px solid var(--line); }
  footer a{ color:var(--ink-dim); cursor:pointer; }
  footer .credit{ display:block; margin-top:6px; font-size:0.74rem; letter-spacing:1px; color: var(--ink-dim); opacity:0.7; }
  .admin-la{
    display:inline-block; font-family:'Bebas Neue','Tajawal',sans-serif; letter-spacing:1px;

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  /* ---------- Professional polish ---------- */

  .calc-search{ transition:border-color .2s, box-shadow .2s; }
  .calc-search:focus{ outline:none; border-color:var(--blue2); box-shadow:0 0 0 3px rgba(78,127,255,.2); }
  .btn:focus-visible,.tab-btn:focus-visible,.calc-search:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ---------- Daily target calculator ---------- */
  .tg-card{ background:var(--panel-solid); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:22px; }

  @media (max-width:640px){ .tg-out{ grid-template-columns:1fr; } }
  .tg-main{ text-align:center; padding:14px 10px; border-radius:14px; background:linear-gradient(160deg,rgba(214,40,57,.18),rgba(30,79,216,.18)); border:1px solid var(--line); }
  .tg-big{ font-family:'Tajawal',sans-serif; font-weight:900; font-size:2.8rem; line-height:1; color:var(--ink); }

  .tg-chip b{ display:block; font-family:'Tajawal',sans-serif; font-size:1.1rem; }

  .tg-macros .tg-chip b.p{ color:var(--blue2); } .tg-macros .tg-chip b.c{ color:var(--gold); } .tg-macros .tg-chip b.f{ color:var(--ink); }

  @media (max-width:640px){ .tg-form{ grid-template-columns:1fr 1fr; } }
  .tg-form label{ display:flex; flex-direction:column; gap:4px; font-size:.78rem; color:var(--ink-dim); }
  .tg-form label.full{ grid-column:1/-1; }
  .tg-form .calc-search{ margin-bottom:0; padding:10px 12px; }
  .tg-err{ color:var(--red2); font-size:.82rem; min-height:1.2em; margin:10px 0 0; }
  .tg-note{ color:var(--ink-dim); font-size:.72rem; margin:10px 0 0; line-height:1.6; }
  .pg{ margin-top:12px; }
  .pg-top{ display:flex; justify-content:space-between; gap:8px; font-size:.78rem; margin-bottom:5px; color:var(--ink-dim); }
  .pg-top .over{ color:var(--red2); }
  .pg-bar{ height:8px; border-radius:999px; background:var(--panel-2); overflow:hidden; }
  .pg-bar i{ display:block; height:100%; border-radius:999px; transition:width .35s ease; }
  .pg-bar i.k{ background:var(--red2); } .pg-bar i.p{ background:var(--blue2); } .pg-bar i.c{ background:var(--gold); } .pg-bar i.f{ background:var(--ink-dim); }
  .pg-bar i.over{ background:var(--danger); }

  /* ---------- Workout tracker ---------- */
  .wk-sum{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }

  .vx-adj b{ color:#ffd700; }
  .vx-ph{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .vq:hover{ border-color:var(--gold); color:var(--gold); }

  .ai-card{ background:var(--panel-solid); border:1px solid var(--line); border-radius:14px; padding:16px; }

  .lib-map .bz:focus-visible{ outline:2px solid var(--gold); }
  .lib-map .bz.on{ fill:var(--red2); }

  /* ---------- Voice notes, habits, templates ---------- */

  .hb-day i.on{ background:#3ddc84; border-color:#3ddc84; }

  // ---------- صور التمارين ----------
  function exImgUrl(id){ return `${API_BASE}/api/plan/image/${id}`; }

  function compressImage(file){
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onerror = () => resolve(file);
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => resolve(file);
        img.onload = () => {
          const max = 1000;
          const ratio = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * ratio);
          canvas.height = Math.round(img.height * ratio);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(b => resolve(b || file), 'image/jpeg', 0.82);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  async function uploadExerciseImage(file){

    const res = await fetch(`${API_BASE}/api/plan/image`, {

      let idx = (oldArr || []).findIndex((oe, j) => !used.has(j) && (oe.imgId || oe.video) && (oe.ar||'').trim() === (ne.ar||'').trim());
      if(idx === -1 && oldArr && oldArr[k] && !used.has(k) && oldArr[k].imgId && !ne.ar.trim()) idx = k;
      if(idx !== -1){ used.add(idx); ne.imgId = oldArr[idx].imgId; if(oldArr[idx].video) ne.video = oldArr[idx].video; }
    });
    return newArr;
  }

  function restSeconds(text){
    const nums = (String(text || '').match(/\d+/g) || []).map(Number).filter(n => n > 0);
    if(!nums.length) return 0;
    let n = Math.max(...nums);
    if(/دقيق|min|minute/i.test(text)) n *= 60;
    return n > 0 && n <= 900 ? n : 0;
  }
  const RT_TEXT = {

  };
  const restTimer = { left:0, running:false, handle:null, el:null };
  function rtText(k){ return (RT_TEXT[currentLang] || RT_TEXT.ar)[k]; }
  function rtFmt(sec){ const m = Math.floor(sec/60), s = sec%60; return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
  function rtBeep(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      const ctx = new Ctx();
      [0, 0.25, 0.5].forEach(d => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.2, ctx.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.2);
        o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.22);
      });
    }catch(e){}
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]); }catch(e){}
  }
  function rtRender(){
    const el = restTimer.el; if(!el) return;
    const done = restTimer.left <= 0;
    el.classList.toggle('done', done);
    el.querySelector('.rt-label').textContent = done ? rtText('done') : rtText('rest');
    el.querySelector('.rt-time').textContent = done ? '00:00' : rtFmt(restTimer.left);
    el.querySelector('.rt-pause').textContent = restTimer.running ? rtText('pause') : rtText('resume');
    el.querySelector('.rt-pause').style.display = done ? 'none' : '';
    el.querySelector('.rt-add').style.display = done ? 'none' : '';
    el.querySelector('.rt-close').textContent = rtText('close');
  }
  function rtStop(){
    clearInterval(restTimer.handle); restTimer.handle = null; restTimer.running = false;
    if(restTimer.el) restTimer.el.classList.remove('show','done');
  }
  function rtTick(){
    restTimer.left -= 1;
    if(restTimer.left <= 0){
      restTimer.left = 0; clearInterval(restTimer.handle); restTimer.handle = null; restTimer.running = false;
      rtRender(); rtBeep();
      setTimeout(() => { if(restTimer.left <= 0 && !restTimer.running) rtStop(); }, 6000);
      return;
    }
    rtRender();
  }
  function rtStart(secs){
    if(!restTimer.el){
      const el = document.createElement('div');
      el.className = 'rest-timer';
      el.innerHTML = '<div><div class="rt-label"></div><div class="rt-time"></div></div>'
        + '<button type="button" class="rt-btn rt-pause"></button>'
        + '<button type="button" class="rt-btn rt-add">+15s</button>'
        + '<button type="button" class="rt-btn rt-close"></button>';
      document.body.appendChild(el);
      restTimer.el = el;
      el.querySelector('.rt-pause').onclick = () => {
        if(restTimer.running){ clearInterval(restTimer.handle); restTimer.running = false; }
        else { restTimer.running = true; restTimer.handle = setInterval(rtTick, 1000); }
        rtRender();
      };
      el.querySelector('.rt-add').onclick = () => { restTimer.left += 15; rtRender(); };
      el.querySelector('.rt-close').onclick = rtStop;
    }
    clearInterval(restTimer.handle);
    restTimer.left = secs; restTimer.running = true;
    restTimer.el.classList.add('show');
    restTimer.handle = setInterval(rtTick, 1000);
    rtRender();
  }

  async function renderProgress0(area){
    const P = PG[currentLang] || PG.ar;
    if(!currentUser){ area.innerHTML = `<div class="log-empty">${P.login}</div>`; return; }
    let rows = [];
    try{ rows = (await (await fetch(`${API_BASE}/api/plan/progress/${encodeURIComponent(currentUser.email)}`)).json()).entries || []; }catch(e){}
    const pts = rows.map(r => ({ d:r.day, w:+r.weight }));
    let chart = `<div class="log-empty">${P.empty}</div>`;
    if(pts.length){
      const ws = pts.map(p => p.w), mn = Math.min(...ws) - 1, mx = Math.max(...ws) + 1;
      const X = i => pts.length === 1 ? 170 : 24 + i * (292 / (pts.length - 1)), Y = w => 140 - (w - mn) / (mx - mn) * 120;
      chart = `<svg viewBox="0 0 340 160" style="width:100%"><polyline fill="none" stroke="#FF4757" stroke-width="2.5" points="${pts.map((p,i) => X(i) + ',' + Y(p.w)).join(' ')}"/>${pts.map((p,i) => `<circle cx="${X(i)}" cy="${Y(p.w)}" r="3.5" fill="#F4C430"/>`).join('')}<text x="2" y="14" fill="#9aa" font-size="10">${mx.toFixed(0)}</text><text x="2" y="152" fill="#9aa" font-size="10">${mn.toFixed(0)}</text></svg>
        <div class="fmeta" style="text-align:center">${pts[0].d} → ${pts[pts.length-1].d} · ${pts[0].w} → <b style="color:var(--gold)">${pts[pts.length-1].w} kg</b></div>`;
    }
    area.innerHTML = `<div class="log-panel"><h3 style="margin-bottom:12px">📈 ${P.title}</h3>${chart}
      <div class="cf-row2" style="margin-top:14px"><input class="calc-search" id="pgW" type="number" step="0.1" min="20" max="400" placeholder="${P.w}" style="margin:0"><button type="button" class="btn small primary" id="pgAdd">${P.add}</button></div></div>`;
    document.getElementById('pgAdd').onclick = async () => {
      const w = parseFloat(document.getElementById('pgW').value);
      if(!(w >= 20 && w <= 400)){ alert(P.need); return; }
      try{ await fetch(`${API_BASE}/api/plan/progress`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: currentUser.email, weight: w }) }); }catch(e){}
      renderProgress(area);
    };

  function renderLog(){

    if(calcLog.length === 0){

        };

        btn.onclick = () => { calcLog.splice(+btn.dataset.i, 1); renderLog(); };

      const ratio = item.grams / 100;
      acc.kcal += item.kcal * ratio; acc.p += item.p * ratio; acc.c += item.c * ratio; acc.f += item.f * ratio;
      return acc;
    }, { kcal:0, p:0, c:0, f:0 });

  const VOT = {

  };
  function voiceInit(box, email, role){
    const T = VOT[currentLang] || VOT.ar, hdr = role === 'coach' ? { 'x-admin-password': adminPassword } : { 'x-member-email': email };
    const URLV = `${API_BASE}/api/plan/vip/voice`;
    let rec = null, chunks = [], blob = null, timer = null, secs = 0, stream = null;
    box.innerHTML = `<div class="vo-box"><h4>${T.t}</h4><div class="vo-list"></div><div class="vo-ctl"><button type="button" class="btn small ghost vo-r">${T.rec}</button><span class="vo-time" hidden>0:00</span><audio class="vo-p" controls hidden></audio><button type="button" class="btn small primary vo-s" hidden>${T.send}</button><button type="button" class="btn small ghost vo-c" hidden>${T.cancel}</button></div><p class="vx-note vo-m" role="status"></p></div>`;
    const q = c => box.querySelector(c), msg = t => { q('.vo-m').textContent = t || ''; };
    const rBtn = q('.vo-r'), tm = q('.vo-time'), pv = q('.vo-p'), sBtn = q('.vo-s'), cBtn = q('.vo-c');
    const fmt = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
    function reset(){ blob = null; chunks = []; secs = 0; pv.hidden = sBtn.hidden = cBtn.hidden = tm.hidden = true; pv.removeAttribute('src'); rBtn.hidden = false; rBtn.textContent = T.rec; rBtn.classList.remove('vo-rec'); }
    async function load(){
      const L = q('.vo-list');
      try{
        const r = await fetch(`${URLV}/${encodeURIComponent(email)}`, { headers: hdr });
        if(!r.ok) throw new Error(r.status);
        const items = ((await r.json()).notes || []).filter(n => typeof n.audio === 'string' && n.audio.startsWith('data:audio/'));
        L.innerHTML = items.length ? items.slice().reverse().map(n => `<div class="vo-item ${n.from_role === 'coach' ? 'coach' : 'member'}"><b>${n.from_role === 'coach' ? T.coach : T.client}</b> · ${new Date(n.created_at).toLocaleString(currentLang === 'ar' ? 'ar-EG' : currentLang)} · ${fmt(+n.duration || 0)}<audio controls preload="none" src="${escapeHtml(n.audio)}"></audio></div>`).join('') : `<div class="vo-item">${T.none}</div>`;
      }catch(e){ L.innerHTML = `<div class="vo-item">${T.none}</div>`; }
    }
    function stopRec(){ clearInterval(timer); if(rec && rec.state !== 'inactive') rec.stop(); }
    rBtn.onclick = async () => {
      if(rec && rec.state === 'recording'){ stopRec(); return; }
      msg('');
      if(!navigator.mediaDevices || !window.MediaRecorder){ msg(T.mic); return; }
      try{ stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }catch(e){ msg(T.mic); return; }
      const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported(m));
      rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
      chunks = []; secs = 0;
      rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        blob = new Blob(chunks, { type: rec.mimeType || mime || 'audio/webm' });
        pv.src = URL.createObjectURL(blob); pv.hidden = sBtn.hidden = cBtn.hidden = false; rBtn.hidden = true; rBtn.classList.remove('vo-rec');
      };
      rec.start();

  const HBT = {

  };
  function hbKey(off){ const d = new Date(); d.setDate(d.getDate() - (off || 0)); return d.toLocaleDateString('en-CA'); }
  function hbLoad(){ try{ const v = JSON.parse(localStorage.getItem('lhta-habits') || '{}'); return v && typeof v === 'object' ? v : {}; }catch(e){ return {}; } }
  function hbScore(e){ e = e || {}; return (e.w >= 8 ? 1 : 0) + (e.s ? 1 : 0) + (e.z ? 1 : 0) + (e.t ? 1 : 0); }
  function hbStreak(m){ let n = 0, off = hbScore(m[hbKey(0)]) >= 3 ? 0 : 1; while(hbScore(m[hbKey(off)]) >= 3){ n++; off++; } return n; }
  function renderHabits(area){
    const T = HBT[currentLang] || HBT.ar, box = document.createElement('div'); box.className = 'tg-card';
    area.prepend(box);
    function draw(){
      const m = hbLoad(), k = hbKey(0), e = m[k] || { w:0, s:0, z:0, t:0 };
      const tog = (f, l) => `<div class="hb-row"><span>${l}</span><button type="button" class="hb-tog${e[f] ? ' on' : ''}" data-f="${f}" aria-pressed="${!!e[f]}">${e[f] ? '✓' : '○'}</button></div>`;
      const strip = [6, 5, 4, 3, 2, 1, 0].map(o => { const d = new Date(); d.setDate(d.getDate() - o); return `<div class="hb-day"><i class="${hbScore(m[hbKey(o)]) >= 3 ? 'on' : ''}"></i>${d.toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : currentLang, { weekday:'narrow' })}</div>`; }).join('');
      box.innerHTML = `<div class="tg-head"><h3>${T.t}</h3><small>${T.streak}: <b>${hbStreak(m)}</b> ${T.d}</small></div>
        <div class="hb-row"><span>${T.water}</span><span><button type="button" class="btn small ghost" data-w="-1" aria-label="-">−</button> <b style="display:inline-block;min-width:34px;text-align:center">${e.w || 0}/8</b> <button type="button" class="btn small ghost" data-w="1" aria-label="+">+</button></span></div>
        ${tog('s', T.steps)}${tog('z', T.sleep)}${tog('t', T.train)}<div class="hb-strip">${strip}</div><p class="tg-note">${T.hint}</p>`;
      const save = () => { m[k] = e; try{ localStorage.setItem('lhta-habits', JSON.stringify(m)); }catch(x){} draw(); };
      box.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { e[b.dataset.f] = e[b.dataset.f] ? 0 : 1; save(); });
      box.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { e.w = Math.max(0, Math.min(12, (e.w || 0) + (+b.dataset.w))); save(); });
    }
    draw();
  }

          ${accBlock(r)}<textarea class="calc-search vcn" data-id="${r.id}" rows="2" placeholder="ملاحظة خاصة بالمدرب (لا يراها العضو)" style="margin:10px 0 0">${escapeHtml(localStorage.getItem('lhta-cnote:' + r.id) || '')}</textarea>${r.status === 'pending' ? `<div style="margin-top:8px"><input class="calc-search vnote" placeholder="رسالة للعضو (اختياري)" style="margin-bottom:8px">
            <button class="btn small primary vdec" data-s="accepted">قبول</button> <button class="btn small ghost vdec" data-s="rejected">رفض</button></div>` : ''}
        </div>`; }).join('') : '<div class="log-empty">لا توجد طلبات بعد</div>');
      area.querySelectorAll('.vsaveprog').forEach(btn => {
        btn.onclick = async () => {
          const box = btn.closest('.vip-req');
          await fetch(`${API_BASE}/api/plan/vip/${box.dataset.id}/program`, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-password': adminPassword }, body: JSON.stringify({ program: box.querySelector('.vprog').value }) });
          alert('تم الحفظ');
        };
      });
      area.querySelectorAll('.vrepbtn').forEach(btn => {
        btn.onclick = async () => {
          const inp = btn.parentElement.querySelector('.vrep');
          let rs; try{ rs = await fetch(`${API_BASE}/api/plan/vip/checkin/${btn.dataset.c}/reply`, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-password': adminPassword }, body: JSON.stringify({ reply: inp.value }) }); }catch(e){}
          if(!rs || !rs.ok){ alert('تعذر الإرسال، حاول مرة أخرى'); return; }
          const now = new Date().toISOString();
          try{ localStorage.setItem('lhta-rlog:' + btn.dataset.c, now); }catch(e){}
          let sm = btn.parentElement.querySelector('.rlog');
          if(!sm){ sm = document.createElement('small'); sm.className = 'rlog'; sm.style.color = 'var(--ink-dim)'; inp.before(sm); sm.after(document.createElement('br')); }
          sm.textContent = 'ردّيت: ' + new Date(now).toLocaleString('ar-EG');
          alert('تم الإرسال');
        };
      });
      area.querySelectorAll('.vdec').forEach(btn => {
        btn.onclick = async () => {
          const box = btn.closest('.vip-req');
          await fetch(`${API_BASE}/api/plan/vip/${box.dataset.id}/decision`, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-password': adminPassword }, body: JSON.stringify({ status: btn.dataset.s, note: box.querySelector('.vnote').value }) });
          renderAdminView();
        };
      });
      area.querySelectorAll('.vrec').forEach(a => a.onclick = async ev => {
        ev.preventDefault(); const w = window.open('', '_blank');
        const rs = await fetch(`${API_BASE}/api/plan/vip/receipt/${a.dataset.r}`, { headers:{ 'x-admin-password': adminPassword } });
        if(!rs.ok){ if(w) w.close(); alert('تعذر فتح الوصل'); return; }
        const url = URL.createObjectURL(await rs.blob()); if(w) w.location = url; else window.open(url, '_blank');
      });
      area.querySelectorAll('.vgen').forEach(btn => btn.onclick = () => {
        const box = btn.closest('.vip-req'), r = reqs.find(x => String(x.id) === box.dataset.id), ta = box.querySelector('.vprog');
        if(ta.value.trim() && !confirm('استبدال البرنامج الحالي بالمسودة؟')) return;
        ta.value = vipGen(r.data || {});
      });
      vipFilterInit(area);
      document.getElementById('vCsv').onclick = () => adminVipCsv(reqs);
      area.querySelectorAll('.vv').forEach(b => voiceInit(b, b.dataset.email, 'coach'));
    } else if(activeAdminTab === 'stats'){
      let st = {};
      try{ st = await (await fetch(`${API_BASE}/api/admin/stats`, { headers:{ 'x-admin-password': adminPassword } })).json(); }catch(e){}
      const it = (l, v) => `<div class="summary-item"><span class="slabel">${l}</span><span class="sval">${v ?? '—'}</span></div>`;
      area.innerHTML = `<div class="summary-bar">${it('إجمالي الأعضاء', st.members)}${it('جدد آخر 7 أيام', st.week)}${it('طلبات VIP بالانتظار', st.pending)}${it('VIP مقبولة', st.accepted)}${it('كل طلبات VIP', st.total)}</div>`;
    adminInsights(area);
    } else if(activeAdminTab === 'nutrition'){
      const plan = await loadPlan();
      const n = plan.nutrition;
      area.innerHTML = `
        <div class="edit-day">
          <div class="day-title">الإعدادات العامة</div>
          <div class="edit-grid">
            <div class="field"><label>السعرات اليومية</label><input id="nutKcal" value="${escapeHtml(n.dailyCalories)}"></div>
            <div class="field"><label>البروتين المستهدف</label><input id="nutProtein" value="${escapeHtml(n.proteinTarget)}"></div>
          </div>
        </div>
      ` + n.meals.map((m,i) => `
        <div class="edit-day">
          <div class="day-title">وجبة ${i+1}: ${escapeHtml(m.title)}</div>
          <div class="edit-grid">
            <div class="field"><label>اسم الوجبة (عربي)</label><input data-mi="${i}" data-mf="title" value="${escapeHtml(m.title)}"></div>
            <div class="field"><label>اسم الوجبة (En/Fr)</label><input data-mi="${i}" data-mf="titleEn" value="${escapeHtml(m.titleEn)}"></div>
            <div class="field"><label>سعرات (kcal)</label><input data-mi="${i}" data-mf="kcal" type="number" value="${m.kcal}"></div>
            <div class="field"><label>بروتين (غ)</label><input data-mi="${i}" data-mf="p" type="number" value="${m.p}"></div>
            <div class="field"><label>كارب (غ)</label><input data-mi="${i}" data-mf="c" type="number" value="${m.c}"></div>
            <div class="field"><label>دهون (غ)</label><input data-mi="${i}" data-mf="f" type="number" value="${m.f}"></div>
          </div>
          <div class="field"><label>عناصر الوجبة — سطر لكل عنصر بالصيغة: التسمية|التفاصيل</label><textarea data-mi="${i}" data-mf="items" rows="4">${escapeHtml(itemsToText(m.items))}</textarea></div>
        </div>
      `).join('') + `
        <div class="edit-day">
          <div class="day-title">قواعد عامة (تظهر أسفل صفحة التغذية)</div>
          <div class="field"><label>سطر لكل قاعدة بالصيغة: العنوان|النص</label><textarea id="nutRules" rows="4">${escapeHtml((n.rules||[]).map(r => r.title+'|'+r.text).join('\n'))}</textarea></div>
        </div>
      ` + `<button class="btn primary" id="saveNutrition">حفظ التعديلات</button>`;

      document.getElementById('saveNutrition').onclick = async () => {
        n.dailyCalories = document.getElementById('nutKcal').value;
        n.proteinTarget = document.getElementById('nutProtein').value;
        area.querySelectorAll('[data-mi]').forEach(el => {
          const i = +el.dataset.mi, f = el.dataset.mf;
          if(f === 'items'){ n.meals[i].items = textToItems(el.value); }
          else if(f === 'kcal' || f === 'p' || f === 'c' || f === 'f'){ n.meals[i][f] = +el.value || 0; }
          else{ n.meals[i][f] = el.value; }
        });
        n.rules = document.getElementById('nutRules').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          const idx = l.indexOf('|');
          return idx === -1 ? { title:l, text:'' } : { title:l.slice(0,idx).trim(), text:l.slice(idx+1).trim() };
        });
        await savePlan(plan);
        alert('تم الحفظ');
      };
    }
  }

  // ---------- static text translation ----------
  function applyStaticI18n(){
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      el.innerHTML = t(key);
    });
  }

  // ---------- dispatcher ----------
  function renderApp(){
    applyLangDirection();
    renderTopbar();
    applyStaticI18n();
    if(isAdmin) renderAdminView();
    else renderPublicView();
  }

  // ---------- hidden admin trigger (اضغط 3 مرات على LA) ----------
  let laClickCount = 0, laClickTimer = null;
  document.getElementById('adminLA').onclick = () => {
    laClickCount++;
    clearTimeout(laClickTimer);
    laClickTimer = setTimeout(() => { laClickCount = 0; }, 900);
    if(laClickCount >= 3){
      laClickCount = 0;
      openModal('adminBackdrop');
    }
  };

  // ---------- modal helpers ----------
  function openModal(id){ document.getElementById(id).classList.add('open'); }
  function closeModal(id){
    document.getElementById(id).classList.remove('open');
    const err = document.getElementById(id).querySelector('.error');
    if(err) err.textContent = '';
  }
  document.getElementById('regCancel').onclick = () => closeModal('registerBackdrop');
  document.getElementById('logCancel').onclick = () => closeModal('loginBackdrop');
  document.getElementById('adminCancel').onclick = () => closeModal('adminBackdrop');
  document.getElementById('toLogin').onclick = () => { closeModal('registerBackdrop'); openModal('loginBackdrop'); };
  document.getElementById('toRegister').onclick = () => { closeModal('loginBackdrop'); openModal('registerBackdrop'); };
  ['registerBackdrop','loginBackdrop','adminBackdrop'].forEach(id => {
    document.getElementById(id).addEventListener('click', (e) => { if(e.target.id === id) closeModal(id); });
  });

  // ---------- settings drawer ----------
  document.getElementById('settingsBtn').onclick = () => {
    document.getElementById('settingsBackdrop').classList.add('open');
    document.getElementById('settingsDrawer').classList.add('open');
    document.querySelectorAll('.lang-options button').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  };
  function closeDrawer(){
    document.getElementById('settingsDrawer').classList.remove('open');
    setTimeout(() => document.getElementById('settingsBackdrop').classList.remove('open'), 300);
  }
  document.getElementById('settingsClose').onclick = closeDrawer;
  document.getElementById('settingsBackdrop').addEventListener('click', (e) => {
    if(e.target.id === 'settingsBackdrop') closeDrawer();
  });
  document.querySelectorAll('.lang-options button').forEach(btn => {
    btn.onclick = () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem('lhta-lang', currentLang);
      document.querySelectorAll('.lang-options button').forEach(b => b.classList.toggle('active', b === btn));
      renderApp();
    };
  });

  function persistUser(user){
    currentUser = user;
    localStorage.setItem('lhta-user', JSON.stringify(user));
  }

  // استرجاع جلسة المستخدم المحفوظة محليًا (إن وجدت)
  try{
    const savedUser = localStorage.getItem('lhta-user');
    if(savedUser) currentUser = JSON.parse(savedUser);
  }catch(e){}

  // ---------- تسجيل حساب جديد بالإيميل ----------
  document.getElementById('regSubmit').onclick = async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const pass = document.getElementById('regPass').value;
    const errEl = document.getElementById('regError');
    if(!name || !email || !pass){ errEl.textContent = 'عبّي كل الحقول من فضلك'; return; }
    const { ok, data } = await apiPost('/api/auth/register', { name, email, password: pass });
    if(!ok){ errEl.textContent = data.error || 'تعذر التسجيل، حاول مرة أخرى'; return; }
    persistUser(data.user);
    document.getElementById('regName').value = '';
    document.getElementById('regEmail').value = '';
    document.getElementById('regPass').value = '';
    closeModal('registerBackdrop');
    renderApp();
  };

  // ---------- تسجيل الدخول بالإيميل ----------
  document.getElementById('logSubmit').onclick = async () => {
    const email = document.getElementById('logEmail').value.trim().toLowerCase();
    const pass = document.getElementById('logPass').value;
    const errEl = document.getElementById('logError');
    const { ok, data } = await apiPost('/api/auth/login', { email, password: pass });
    if(!ok){ errEl.textContent = data.error || 'الإيميل أو كلمة المرور غير صحيحة'; return; }
    persistUser(data.user);
    document.getElementById('logEmail').value = '';
    document.getElementById('logPass').value = '';
    closeModal('loginBackdrop');
    renderApp();
  };

  // ---------- دخول المشرف (حقيقي عبر الخادم) ----------
  document.getElementById('adminSubmit').onclick = async () => {
    const pass = document.getElementById('adminPass').value;
    const errEl = document.getElementById('adminError');
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pass })
    });
    if(!res.ok){ errEl.textContent = 'كلمة مرور غير صحيحة'; return; }
    adminPassword = pass;
    localStorage.setItem('lhta-admin-pass', pass);
    isAdmin = true;
    document.getElementById('adminPass').value = '';
    closeModal('adminBackdrop');
    renderApp();
  };

  renderApp();
</script>

</body>
</html>
