(function(){
  ['localStorage','sessionStorage'].forEach(function(name){
    var ok=false;
    try{ var s=window[name]; s.setItem('__t','1'); s.removeItem('__t'); ok=true; }catch(e){console.warn(e)}
    if(ok) return;
    var m={};
    var shim={
      getItem:function(k){ return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null; },
      setItem:function(k,v){ m[k]=String(v); },
      removeItem:function(k){ delete m[k]; },
      clear:function(){ m={}; },
      key:function(i){ return Object.keys(m)[i]||null; },
      get length(){ return Object.keys(m).length; }
    };
    try{ Object.defineProperty(window,name,{value:shim,configurable:true}); }catch(e){console.warn(e)}
  });
})();
</script>

  .gl-ic{ width:68px; height:68px; font-size:2.3rem; line-height:1; font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 30% 25%, rgba(78,127,255,.28), rgba(255,71,87,.10) 70%);

  img.emoji{ height:1em; width:1em; margin:0 .06em; vertical-align:-0.12em; display:inline-block; }

  function applyLangDirection(){

  // ---------- الاتصال بالخادم الحقيقي ----------
  const API_BASE = 'https://lhta-backend.onrender.com';
  let adminPassword = sessionStorage.getItem('lhta-admin-pass') || '';

  async function apiGet(path){
    const res = await fetch(`${API_BASE}${path}`);
    return res.json();
  }
  async function apiPost(path, body, adminHeader){
    const headers = { 'Content-Type': 'application/json' };
    if(adminHeader) headers['x-admin-password'] = adminPassword;
    const res = await fetch(`${API_BASE}${path}`, { method:'POST', headers, body: JSON.stringify(body || {}) });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, data };
  }

  async function loadPlan(){
    try{
      const { plan } = await apiGet('/api/plan');
      return plan || { workout: defaultWorkoutPlan, nutrition: defaultMealPlan, summary: PLAN_SUMMARY };
    }catch(e){
      return { workout: defaultWorkoutPlan, nutrition: defaultMealPlan, summary: PLAN_SUMMARY };
    }
  }
  async function savePlan(plan){
    const { ok, data } = await apiPost('/api/plan', { plan }, true);
    if(!ok) alert(data.error || 'تعذر الحفظ - تحقق من كلمة مرور المشرف');
    return ok;
  }
  async function fetchAdminMembers(){
    try{
      const res = await fetch(`${API_BASE}/api/admin/members`, { headers: { 'x-admin-password': adminPassword } });
      if(!res.ok) return [];
      const data = await res.json();
      return data.members || [];
    }catch(e){ return []; }
  }

  function compressImage(file){

          const max = 1000;
          const ratio = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * ratio);
          canvas.height = Math.round(img.height * ratio);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(b => resolve(b || file), 'image/jpeg', 0.82);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function restSeconds(text){
    const nums = (String(text || '').match(/\d+/g) || []).map(Number).filter(n => n > 0);
    if(!nums.length) return 0;
    let n = Math.max(...nums);
    if(/دقيق|min|minute/i.test(text)) n *= 60;
    return n > 0 && n <= 900 ? n : 0;
  }
  const RT_TEXT = {
    ar: { rest:'وقت الراحة', done:'انتهت الراحة! ابدأ المجموعة 💪', pause:'إيقاف', resume:'متابعة', close:'إغلاق' },
    en: { rest:'Rest time', done:'Rest over! Start your set 💪', pause:'Pause', resume:'Resume', close:'Close' },
    fr: { rest:'Repos', done:'Repos terminé ! C\'est reparti 💪', pause:'Pause', resume:'Reprendre', close:'Fermer' }
  };
  const restTimer = { left:0, running:false, handle:null, el:null };
  function rtText(k){ return (RT_TEXT[currentLang] || RT_TEXT.ar)[k]; }
  function rtFmt(sec){ const m = Math.floor(sec/60), s = sec%60; return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
  function rtBeep(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      const ctx = new Ctx();
      [0, 0.25, 0.5].forEach(d => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.2, ctx.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.2);
        o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.22);
      });
    }catch(e){console.warn(e)}
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]); }catch(e){console.warn(e)}
  }
  function rtRender(){
    const el = restTimer.el; if(!el) return;
    const done = restTimer.left <= 0;
    el.classList.toggle('done', done);
    el.querySelector('.rt-label').textContent = done ? rtText('done') : rtText('rest');
    el.querySelector('.rt-time').textContent = done ? '00:00' : rtFmt(restTimer.left);
    el.querySelector('.rt-pause').textContent = restTimer.running ? rtText('pause') : rtText('resume');
    el.querySelector('.rt-pause').style.display = done ? 'none' : '';
    el.querySelector('.rt-add').style.display = done ? 'none' : '';
    el.querySelector('.rt-close').textContent = rtText('close');
  }
  function rtStop(){
    clearInterval(restTimer.handle); restTimer.handle = null; restTimer.running = false;
    if(restTimer.el) restTimer.el.classList.remove('show','done');
  }
  function rtTick(){
    restTimer.left -= 1;
    if(restTimer.left <= 0){
      restTimer.left = 0; clearInterval(restTimer.handle); restTimer.handle = null; restTimer.running = false;
      rtRender(); rtBeep();
      setTimeout(() => { if(restTimer.left <= 0 && !restTimer.running) rtStop(); }, 6000);
      return;
    }
    rtRender();
  }
  function rtStart(secs){
    if(!restTimer.el){
      const el = document.createElement('div');
      el.className = 'rest-timer';
      el.innerHTML = '<div><div class="rt-label"></div><div class="rt-time"></div></div>'
        + '<button type="button" class="rt-btn rt-pause"></button>'
        + '<button type="button" class="rt-btn rt-add">+15s</button>'
        + '<button type="button" class="rt-btn rt-close"></button>';
      document.body.appendChild(el);
      restTimer.el = el;
      el.querySelector('.rt-pause').onclick = () => {
        if(restTimer.running){ clearInterval(restTimer.handle); restTimer.running = false; }
        else { restTimer.running = true; restTimer.handle = setInterval(rtTick, 1000); }
        rtRender();
      };
      el.querySelector('.rt-add').onclick = () => { restTimer.left += 15; rtRender(); };
      el.querySelector('.rt-close').onclick = rtStop;
    }
    clearInterval(restTimer.handle);
    restTimer.left = secs; restTimer.running = true;
    restTimer.el.classList.add('show');
    restTimer.handle = setInterval(rtTick, 1000);
    rtRender();
  }

  // ---------- نشاط التمرين: سلسلة أيام، تحدي 30 يوماً، شارات، لوحة صدارة ----------
  let recipeMaxTime = 0;
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  async function renderActivity(area){
    if(!currentUser) return;
    const box = document.createElement('div');
    box.style.cssText = 'margin-top:16px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)';
    area.appendChild(box);
    let days = [], board = [];
    try{ days = (await (await fetch(`${API_BASE}/api/activity/${encodeURIComponent(currentUser.email)}`)).json()).days || []; }catch(e){console.warn(e)}
    try{ board = (await (await fetch(`${API_BASE}/api/activity/leaderboard`)).json()).board || []; }catch(e){console.warn(e)}
    const set = new Set(days), today = new Date();
    const doneToday = set.has(ymd(today));
    let streak = 0, d = new Date(today); if(!doneToday) d.setDate(d.getDate()-1);
    while(set.has(ymd(d))){ streak++; d.setDate(d.getDate()-1); }
    let best = 0, run = 0; const sorted = [...set].sort();
    sorted.forEach((x,i)=>{ run = (i && (new Date(x) - new Date(sorted[i-1])) === 86400000) ? run+1 : 1; best = Math.max(best, run); });
    const last30 = days.filter(x => (today - new Date(x)) / 86400000 < 30).length;
    const badges = [[3,'⭐','3 أيام'],[7,'🔥','7 أيام'],[14,'💪','14 يوماً'],[30,'🏆','30 يوماً']];
    box.innerHTML = `
      <div style="font-weight:700;margin-bottom:8px">🔥 سلسلتك: ${streak} يوم · 🎯 تحدي 30 يوماً: ${last30}/30</div>
      <div style="height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:10px"><div style="height:100%;width:${Math.round(last30/30*100)}%;background:#ffd700"></div></div>
      <button type="button" id="actBtn" class="btn primary" ${doneToday ? 'disabled' : ''}>${doneToday ? '✅ سجّلت تمرين اليوم' : '✅ أنهيت تمرين اليوم'}</button>
      <div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap">${badges.map(b => `<span style="padding:6px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.15);opacity:${best >= b[0] ? 1 : .35}">${b[1]} ${b[2]}</span>`).join('')}</div>
      <div style="font-weight:700;margin-bottom:6px">🏅 الأكثر التزاماً هذا الأسبوع</div>
      ${board.length ? board.map((r,i) => `<div>${i+1}. ${escapeHtml(r.name)} — ${r.days} أيام</div>`).join('') : '<div style="opacity:.6">كن أول من يسجّل هذا الأسبوع</div>'}`;
    const btn = box.querySelector('#actBtn');

  function micMsg(err, noApi){
    const M = {
      ar:{ insecure:'التسجيل الصوتي لا يعمل عند فتح الملف من الهاتف مباشرة. افتح الموقع من الرابط الرسمي (https) ثم أعد المحاولة.', nosupport:'المتصفح لا يدعم التسجيل الصوتي. جرّب Chrome أو Safari حديث.', denied:'الميكروفون محظور. اضغط على أيقونة القفل بجانب الرابط ← الأذونات ← اسمح بالميكروفون.', nodev:'لم يتم العثور على ميكروفون في جهازك.', busy:'الميكروفون مستخدم من تطبيق آخر. أغلقه وأعد المحاولة.', other:'تعذّر بدء التسجيل. أعد المحاولة.' },
      en:{ insecure:'Voice recording does not work when the file is opened directly on the phone. Open the site from its official https link and try again.', nosupport:'This browser does not support voice recording. Try a recent Chrome or Safari.', denied:'Microphone is blocked. Tap the lock icon next to the address, open Permissions and allow the microphone.', nodev:'No microphone found on your device.', busy:'The microphone is used by another app. Close it and try again.', other:'Could not start recording. Please try again.' },
      fr:{ insecure:'L\'enregistrement vocal ne fonctionne pas quand le fichier est ouvert directement sur le téléphone. Ouvre le site via son lien officiel https puis réessaie.', nosupport:'Ce navigateur ne prend pas en charge l\'enregistrement vocal. Essaie un Chrome ou Safari récent.', denied:'Le micro est bloqué. Touche le cadenas près de l\'adresse, ouvre Autorisations et autorise le micro.', nodev:'Aucun micro détecté sur ton appareil.', busy:'Le micro est utilisé par une autre app. Ferme-la et réessaie.', other:'Impossible de démarrer l\'enregistrement. Réessaie.' }
    }[currentLang] || null;
    const m = M || { insecure:'', nosupport:'', denied:'', nodev:'', busy:'', other:'' };
    if(window.isSecureContext === false) return m.insecure;
    if(noApi) return m.nosupport;
    const n = err && err.name;
    if(n === 'NotAllowedError' || n === 'SecurityError') return m.denied;
    if(n === 'NotFoundError' || n === 'OverconstrainedError') return m.nodev;
    if(n === 'NotReadableError' || n === 'AbortError') return m.busy;
    return m.other;
  }

  function openVoice(name, phone, reqId){
    let rec = null, blobRef = null, chunks = [], stream = null, timer = null, sec = 0, file = null, url = '';
    const wrap = document.createElement('div'); wrap.className = 'vm-back';
    wrap.innerHTML = `<div class="vm-box" role="dialog" aria-modal="true"><h3>🎙️ رسالة صوتية إلى ${escapeHtml(name)}</h3><div class="vm-time" id="vmT">0:00</div><button type="button" class="vm-rec" id="vmR" aria-label="تسجيل">●</button><div id="vmP"></div><div class="vm-act"><button type="button" class="btn small ghost" id="vmX">إغلاق</button></div><p class="vm-note">اضغط للتسجيل ثم اضغط للإيقاف (حتى 3 دقائق). الإرسال عبر واتساب من هاتفك، أو احفظ الملف وأرسله يدوياً.</p></div>`;
    document.body.appendChild(wrap);
    const q = id => wrap.querySelector(id), fmt = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
    const close = () => { clearInterval(timer); try{ if(rec && rec.state !== 'inactive') rec.stop(); }catch(e){console.warn(e)} if(stream) stream.getTracks().forEach(t => t.stop()); if(url) URL.revokeObjectURL(url); wrap.remove(); };
    q('#vmX').onclick = close; wrap.onclick = ev => { if(ev.target === wrap) close(); };
    q('#vmR').onclick = async () => {
      if(rec && rec.state === 'recording'){ rec.stop(); return; }
      if(!navigator.mediaDevices || !window.MediaRecorder){ alert(micMsg(null, true)); return; }
      try{ stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }catch(e){ alert(micMsg(e)); return; }
      const mt = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
      rec = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined); chunks = []; sec = 0; q('#vmP').innerHTML = '';
      rec.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
      rec.onstop = () => {
        clearInterval(timer); stream.getTracks().forEach(t => t.stop()); q('#vmR').classList.remove('live');
        const type = rec.mimeType || 'audio/webm', ext = type.includes('mp4') ? 'm4a' : 'webm';
        const blob = new Blob(chunks, { type }); blobRef = blob; if(url) URL.revokeObjectURL(url); url = URL.createObjectURL(blob);
        file = new File([blob], 'voice-' + Date.now() + '.' + ext, { type });
        q('#vmP').innerHTML = `<audio controls src="${url}"></audio><div class="vm-act">${reqId ? '<button type="button" class="btn small primary" id="vmW">إرسال داخل الموقع</button>' : ''}<button type="button" class="btn small ghost" id="vmS">واتساب</button><button type="button" class="btn small ghost" id="vmD">حفظ الملف</button></div>`;
        q('#vmD').onclick = () => { const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); };
        const W = q('#vmW');
        if(W) W.onclick = async () => {
          W.disabled = true; W.textContent = '...';
          try{
            const rs = await fetch(`${API_BASE}/api/plan/vip/${reqId}/voice?d=${sec}`, { method:'POST', headers:{ 'Content-Type': blobRef.type || 'audio/webm', 'x-admin-password': adminPassword }, body: blobRef });
            if(!rs.ok) throw new Error('x');
            W.textContent = 'تم الإرسال ✓';
          }catch(e){ W.disabled = false; W.textContent = 'إرسال داخل الموقع'; alert('تعذر الإرسال (' + ((e && e.message) || 'network') + '). استخدم زر واتساب أو حفظ الملف كبديل.'); }
        };
        q('#vmS').onclick = async () => {
          try{ if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], text:'LHT+' }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
          q('#vmD').click(); if(phone) window.open(waLink(phone), '_blank', 'noopener'); else alert('تم حفظ الملف، أرسله يدوياً');
        };
      };
      rec.start(); q('#vmR').classList.add('live');
      timer = setInterval(() => { sec++; q('#vmT').textContent = fmt(sec); if(sec >= 180) rec.stop(); }, 1000);
    };
  }

  function wxHome(area){
    const li = {ar:0,en:1,fr:2}[currentLang] || 0;
    const cur = WX_HOME.lv.find(x => x.id === LS.g('lhta-whlv','b')) || WX_HOME.lv[0];
    const cols = [tr3('التمرين','Exercise','Exercice'),tr3('مجموعات×عدات','Sets×Reps','Séries×Reps'),tr3('راحة','Rest','Repos')];
    const day = (d, open) => `<details style="margin:8px 0" ${open?'open':''}><summary><b>${d.t[li]}</b></summary><div style="overflow-x:auto"><table style="width:100%;font-size:.88rem;margin-top:6px"><tr>${cols.map(c=>`<th style="text-align:start;padding:4px 6px;opacity:.7">${c}</th>`).join('')}</tr>${d.x.map(r=>`<tr><td style="padding:4px 6px" dir="auto">${r[0][li]}${li!==1?`<span class="ex-en">${r[0][1]}</span>`:''}${ytA(r[0][1])}</td><td style="padding:4px 6px" dir="auto">${r[1]}</td><td style="padding:4px 6px" dir="auto">${r[2]}</td></tr>`).join('')}</table></div></details>`;
    area.innerHTML = `<div class="vip-card"><h3 class="vip-h">🏠 ${tr3('تمارين منزلية بأدوات بسيطة','Home training, minimal gear','Entraînement maison, peu de matériel')}</h3>
      <div class="sec-switch" style="margin:0 0 12px;max-width:none">${WX_HOME.lv.map(x=>`<button type="button" data-lv="${x.id}" class="${x.id===cur.id?'on':''}" style="padding:8px 6px;font-size:.9rem">${x.s[li]}</button>`).join('')}</div>
      <p style="line-height:1.8;margin:0 0 6px"><b>${cur.n[li]}</b></p>
      ${cur.id==='i' ? `<small style="opacity:.75;display:block;margin-bottom:6px">${WX_HOME.gear[li]}</small>` : ''}
      ${cur.id!=='x' ? day(WX_HOME.warm,false) : ''}
      ${cur.days.map((d,i)=>day(d,i===0)).join('')}
      ${cur.id!=='x' ? day(WX_HOME.cool,false) : ''}
      <small style="opacity:.8;display:block;margin-top:10px;line-height:1.8">${WX_HOME.prog[li]}</small></div>${wxNote()}`;
    area.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { LS.s('lhta-whlv', b.dataset.lv); wxHome(area); });
  }
  function wxBody(area){
    const F = ['w','waist','hip','chest','thigh'], N = [tr3('الوزن كغ','Weight kg','Poids kg'),tr3('الخصر سم','Waist cm','Taille cm'),tr3('الورك سم','Hips cm','Hanches cm'),tr3('الصدر سم','Chest cm','Poitrine cm'),tr3('الفخذ سم','Thigh cm','Cuisse cm')];
    const rows = LS.g('lhta-w-body',[]), first = rows.length ? rows[rows.length-1] : null;
    const dl = (k,v) => { if(!first || !v || !first[k] || first===rows[0]) return ''; const x = +(v-first[k]).toFixed(1); return ` <small style="opacity:.7">(${x>0?'+':''}${x})</small>`; };
    area.innerHTML = `<div class="vip-card"><h3 class="vip-h">📏 ${tr3('قياسات الجسم','Body measurements','Mensurations')}</h3>
      <div class="vip-form">${F.map((k,i)=>`<div><label>${N[i]}</label><input class="calc-search" id="wb_${k}" type="number" step="0.1" min="0"></div>`).join('')}</div>
      <button type="button" class="btn vip-btn" id="wbS" style="margin-top:10px">${tr3('حفظ القياسات','Save','Enregistrer')}</button>
      <div style="margin-top:14px;line-height:2">${rows.length ? rows.map((r,j)=>{ const whr = r.waist && r.hip ? ' · WHR ' + (r.waist/r.hip).toFixed(2) : ''; return `<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${r.d}</b>${whr}<br>${F.map((k,i)=>r[k]?N[i]+': '+r[k]+dl(k,r[k]):'').filter(Boolean).join(' · ')}</div>`; }).join('') : `<p style="opacity:.7">${tr3('لا قياسات بعد. قيسي كل أسبوعين بنفس الوقت والظروف.','No entries yet. Measure every 2 weeks, same time and conditions.','Aucune mesure. Mesure toutes les 2 semaines, mêmes conditions.')}</p>`}</div>
      ${rows.length ? `<button type="button" class="btn small vip-btn" id="wbU" style="width:auto;margin-top:8px">↩️ ${tr3('حذف آخر قياس','Delete latest','Supprimer la dernière')}</button>` : ''}</div>
      <small style="opacity:.6;display:block;margin:6px 0 14px">${tr3('الأرقام المقارنة تظهر بين كل قياس وأول قياس. القياسات أدق من الميزان وحده.','Changes are shown against your first entry. Measurements tell more than the scale alone.','Les écarts sont comparés à ta première mesure.')}</small>`;
    area.querySelector('#wbS').onclick = () => { const o = {d:new Date().toLocaleDateString()}; let any = false; F.forEach(k=>{ const v = parseFloat(area.querySelector('#wb_'+k).value); if(v>0){ o[k]=v; any=true; } }); if(!any) return; rows.unshift(o); LS.s('lhta-w-body',rows.slice(0,100)); wxBody(area); };
    const u = area.querySelector('#wbU'); if(u) u.onclick = () => { rows.shift(); LS.s('lhta-w-body',rows); wxBody(area); };
  }

  const INFO = [
    {g:'f',k:'gym',t:['التمرين أثناء الحمل','Training during pregnancy','Sport pendant la grossesse'],x:['إذا سمح الطبيب: نشاط معتدل (مشي، سباحة، قوة خفيفة) مع إمكانية الحديث أثناء الجهد. تجنّبي الاستلقاء الطويل على الظهر بعد الثلث الأول، ورياضات الاحتكاك أو خطر السقوط، والرفع حتى الفشل، والحرارة العالية. توقفي فوراً وراجعي الطبيب عند نزيف أو دوار أو ألم أو ضيق نفس.','If your doctor agrees: moderate activity (walking, swimming, light strength) at a pace where you can talk. Avoid long periods lying on your back after the first trimester, contact or fall-risk sports, lifting to failure and overheating. Stop and see your doctor for bleeding, dizziness, pain or breathlessness.','Si ton médecin est d’accord : activité modérée (marche, natation, force légère) en pouvant parler. Évite de rester longtemps sur le dos après le 1er trimestre, les sports à contact ou risque de chute, l’échec musculaire et la chaleur. Arrête et consulte en cas de saignement, vertige, douleur ou essoufflement.']},
    {g:'f',k:'gym',t:['بعد الولادة','Postpartum return','Reprise post-partum'],x:['انتظري موافقة الطبيب (غالباً 6-8 أسابيع، وأطول بعد القيصرية). ابدئي بالمشي وتمارين قاع الحوض والتنفس العميق ثم زيدي الحمل تدريجياً. افحصي تباعد عضلات البطن قبل تمارين البطن، وتجنّبي الكرنشات إن وُجد.','Wait for medical clearance (often 6-8 weeks, longer after C-section). Start with walking, pelvic-floor work and deep breathing, then build load gradually. Check for abdominal separation before ab work and avoid crunches if present.','Attends l’accord médical (souvent 6-8 semaines, plus après césarienne). Commence par marche, périnée et respiration, puis augmente progressivement. Vérifie la diastase avant les abdos et évite les crunchs si elle existe.']},
    {g:'f',k:'nut',t:['الحديد وفيتامين D','Iron & vitamin D','Fer & vitamine D'],x:['نقص الحديد شائع عند النساء ويسبب تعباً وضعف أداء: اجمعي الأطعمة الغنية بالحديد مع فيتامين C (ليمون، فلفل) وتجنّبي الشاي مع الوجبة. فيتامين D من الشمس 10-20 دقيقة والأسماك الدهنية. اطلبي من طبيبك فحص الفيريتين وفيتامين D مرة أو مرتين سنوياً، ولا تتناولي مكملات الحديد دون فحص.','Low iron is common in women and causes fatigue and weaker performance: pair iron-rich foods with vitamin C (lemon, peppers) and avoid tea with meals. Vitamin D: 10-20 min of sun and oily fish. Ask your doctor to check ferritin and vitamin D once or twice a year, and do not take iron supplements without testing.','Le manque de fer est fréquent chez les femmes (fatigue, baisse de performance) : associe aliments riches en fer et vitamine C (citron, poivron), évite le thé au repas. Vitamine D : 10-20 min de soleil et poissons gras. Fais contrôler ferritine et vitamine D 1-2 fois par an, sans supplément de fer sans analyse.']},
    {g:'m',k:'gym',t:['جزئيات التمدد (Lengthened Partials)','Lengthened Partials','Répétitions partielles en étirement'],x:['بعد آخر تكرار كامل، أضف 3-5 تكرارات جزئية في أسفل الحركة (وضع التمدد). تدريب العضلة وهي ممدودة يحفّز التضخم أكثر في دراسات عدة. استعملها مع Incline Curl وRDV وPress مائل.','After your last full rep, add 3-5 partial reps in the stretched bottom position. Training muscles at long lengths shows strong hypertrophy results in several studies. Use on incline curls, RDLs, incline press.','Après ta dernière rep complète, ajoute 3-5 reps partielles en position étirée. Travailler à grande longueur musculaire donne de bons résultats d’hypertrophie. Utile en curl incliné, RDL, développé incliné.']},
    {g:'m',k:'gym',t:['Rest-Pause لتوفير الوقت','Rest-Pause for time','Rest-Pause pour gagner du temps'],x:['بعد مجموعة قريبة من الفشل: ارتح 15 ثانية، اعمل 3-5 تكرارات، كرّر 3 مرات. مناسبة لتمارين العزل مرة أسبوعياً لكل عضلة، لا للتمارين الثقيلة المركبة.','After a near-failure set: rest 15s, do 3-5 reps, repeat 3 times. Best for isolation work once a week per muscle, not for heavy compounds.','Après une série proche de l’échec : 15 s de repos, 3-5 reps, x3. Pour l’isolation une fois par semaine par muscle, pas pour les gros polyarticulaires.']},
    {g:'m',k:'nut',t:['النوم والتستوستيرون','Sleep & testosterone','Sommeil & testostérone'],x:['أسبوع من النوم 5 ساعات خفّض التستوستيرون عند شبان أصحاء بنحو 10-15% في دراسة معروفة. العجز الحراري الشديد وانخفاض الدهون جداً يؤثران كذلك. اهتم بالنوم 7-9 ساعات، وبالزنك والمغنيسيوم وفيتامين D من الغذاء، وتجنّب «منشطات التستوستيرون». راجع طبيباً عند الأعراض.','A week of 5-hour sleep lowered testosterone about 10-15% in healthy young men in a well-known study. Very large deficits and very low body fat also hurt it. Aim for 7-9 h sleep, zinc, magnesium and vitamin D from food, skip “testosterone boosters”, and see a doctor with symptoms.','Une semaine à 5 h de sommeil a baissé la testostérone d’environ 10-15 % chez de jeunes hommes sains. Un gros déficit et une graisse très basse aussi. Vise 7-9 h de sommeil, zinc, magnésium, vitamine D par l’alimentation, évite les « boosters », consulte en cas de symptômes.']},
    {g:'m',k:'cali',t:['قوة القبضة والأوتار','Grip & tendons','Grip & tendons'],x:['قوة القبضة مؤشر مرتبط بالصحة وطول العمر: اعمل Dead hang مرتين أسبوعياً حتى الإجهاد. الأوتار تتكيف أبطأ من العضلات (أشهر)، فاستعمل كتل 8-12 أسبوعاً قبل رفع صعوبة Planche وFront Lever.','Grip strength is linked to health and longevity: dead hang twice a week to near failure. Tendons adapt slower than muscle (months), so use 8-12 week blocks before progressing planche and front lever.','La force de grip est liée à la santé et la longévité : dead hang 2 fois/sem. Les tendons s’adaptent plus lentement (mois) : blocs de 8-12 semaines avant de durcir planche et front lever.']},
    {g:'f',k:'gym',t:['الدورة: لا تلغي تمرينك تلقائياً','Cycle: don’t auto-skip training','Cycle : ne saute pas tes séances d’office'],x:['المراجعات العلمية تُظهر فروقاً صغيرة وغير ثابتة في القوة بين مراحل الدورة، والتباين بين النساء كبير. القاعدة: تدرّبي حسب شعورك، وعدّلي الحمل عند التعب، لا حسب التقويم فقط.','Reviews show small, inconsistent strength differences between cycle phases, with large individual variation. Rule: train by how you feel and adjust load when tired, not by the calendar alone.','Les revues montrent des écarts faibles et inconstants entre phases, avec une grande variabilité individuelle. Règle : entraîne-toi selon ton ressenti, pas seulement selon le calendrier.']},
    {g:'f',k:'gym',t:['حماية الركبة (ACL)','Knee protection (ACL)','Protection du genou (LCA)'],x:['إصابات الرباط الصليبي غير التلامسية أكثر عند النساء. برامج التحكم العصبي-العضلي (Nordic curl، RDL أحادي، هبوط صحيح بالركبتين للخارج) خفّضت الإصابات بنسبة كبيرة في دراسات. أضيفيها 10 دقائق في الإحماء.','Non-contact ACL injuries are more common in women. Neuromuscular programs (Nordic curls, single-leg RDL, proper landing with knees tracking out) cut injuries substantially in studies. Add them for 10 minutes in your warm-up.','Les ruptures du LCA sans contact sont plus fréquentes chez la femme. Les programmes neuromusculaires (Nordic curl, RDL unilatéral, réception genoux alignés) réduisent nettement les blessures. Ajoute-les 10 min à l’échauffement.']},
    {g:'f',k:'nut',t:['الحديد والطاقة المتاحة','Iron & energy availability','Fer & disponibilité énergétique'],x:['النساء في سن الحيض أكثر عرضة لنقص الحديد: اطلبي تحليل الفيريتين قبل أي مكمل. وانخفاض الطاقة المتاحة (نحو أقل من 30 سعرة لكل كغ من الكتلة الخالية يومياً) قد يعطّل الدورة ويضعف العظام (RED-S). غياب الدورة علامة لزيارة الطبيبة. الكرياتين 3-5 غ مفيد للنساء كذلك.','Menstruating women are more prone to iron deficiency: ask for a ferritin test before supplementing. Low energy availability (roughly under 30 kcal per kg fat-free mass daily) can disrupt the cycle and weaken bone (RED-S). A missing period is a reason to see a doctor. Creatine 3-5 g helps women too.','Les femmes réglées ont plus de risque de carence en fer : fais doser la ferritine avant tout complément. Une faible disponibilité énergétique (environ < 30 kcal/kg de masse maigre/jour) peut perturber le cycle et fragiliser l’os (RED-S). Absence de règles = consulter. La créatine 3-5 g convient aussi aux femmes.']},
    {g:'f',k:'cali',t:['أول Pull-up للنساء','First pull-up for women','Première traction pour les femmes'],x:['النسبة بين قوة الجزء العلوي ووزن الجسم أقل غالباً، فلا تستعجلي: ابدئي بـ Dead hang وNegatives 5 ثوانٍ وBand-assisted، وقوّي الظهر بـ Rows. التقدّم بتخفيف الباند كل أسبوع.','Upper-body strength relative to bodyweight is often lower, so don’t rush: start with dead hangs, 5s negatives and band-assisted reps, build the back with rows, and use a lighter band weekly.','La force du haut du corps relative au poids est souvent plus faible : ne te presse pas. Dead hang, négatives 5 s, élastique, rows, et élastique plus léger chaque semaine.']}

asts over a week or comes with swelling or numbness.", "Une courbature légère est normale, mais une douleur vive, articulaire ou croissante est un signal d'arrêt. Arrête l'exercice en cause, allège la charge et consulte si cela dure plus d'une semaine ou s'accompagne de gonflement ou d'engourdissement."]}, {"g": "m", "k": "cali", "t": ["إحماء الرسغ والكتف", "Wrist & shoulder prep", "Préparer poignets et épaules"], "x": ["قبل الضغط والبلانش والعقلة: دوّر الرسغين والكتفين 30 ثانية، ثم نفّذ وضعية اللوح (Plank) ودفع الكتف لمدة دقيقتين. هذه المناطق أكثر ما يتأذى في الكاليستينكس.", "Before push-ups, planche and pull-ups: circle wrists and shoulders for 30 s, then do 2 minutes of plank and scapular pushes. These areas get hurt most in calisthenics.", "Avant pompes, planche et tractions : fais des rotations des poignets et épaules 30 s, puis 2 min de gainage et poussées scapulaires. Ce sont les zones les plus sollicitées en callisthénie."]}, {"g": "f", "k": "cali", "t": ["إحماء الرسغ والكتف", "Wrist & shoulder prep", "Préparer poignets et épaules"], "x": ["قبل الضغط والبلانش والعقلة: دوّر الرسغين والكتفين 30 ثانية، ثم نفّذ وضعية اللوح (Plank) ودفع الكتف لمدة دقيقتين. هذه المناطق أكثر ما يتأذى في الكاليستينكس.", "Before push-ups, planche and pull-ups: circle wrists and shoulders for 30 s, then do 2 minutes of plank and scapular pushes. These areas get hurt most in calisthenics.", "Avant pompes, planche et tractions : fais des rotations des poignets et épaules 30 s, puis 2 min de gainage et poussées scapulaires. Ce sont les zones les plus sollicitées en callisthénie."]}, {"g": "m", "k": "cali", "t": ["التدرّج بدون أوزان", "Progressing without weights", "Progresser sans charges"], "x": ["عندما تتقن 3 مجموعات من 12 تكراراً انتقل لنسخة أصعب: ضغط مائل ثم عادي ثم بتركيز على جهة واحدة، وأبطئ النزول 3 ثوانٍ لزيادة الصعوبة.", "When you can do 3 sets of 12, move to a harder variation: incline, then standard, then archer push-ups, and slow the lowering to 3 seconds to add difficulty.", lements: what is worth it?", "Compléments : lesquels valent le coup ?"], "x": ["الأساس هو الأكل والنوم. المكملات ذات الدليل الجيد: الكرياتين مونوهيدرات (3 إلى 5 غ يومياً)، والبروتين لتغطية النقص في الوجبات، والكافيين باعتدال. استشر طبيبك قبل أي مكمل خاصة مع الأمراض أو الأدوية.", "Food and sleep come first. Well-supported supplements: creatine monohydrate (3-5 g daily), protein powder to fill gaps, and moderate caffeine. Check with your doctor before any supplement, especially with conditions or medication.", "L'alimentation et le sommeil d'abord. Compléments bien étayés : créatine monohydrate (3-5 g/jour), protéine en poudre pour combler les manques, caféine modérée. Demande l'avis d'un médecin, surtout si tu as une maladie ou un traitement."]}, {"g": "f", "k": "nut", "t": ["المكملات: ما الذي يستحق؟", "Supplements: what is worth it?", "Compléments : lesquels valent le coup ?"], "x": ["الأساس هو الأكل والنوم. المكملات ذات الدليل الجيد: الكرياتين مونوهيدرات (3 إلى 5 غ يومياً)، والبروتين لتغطية النقص في الوجبات، والكافيين باعتدال. استشر طبيبك قبل أي مكمل خاصة مع الأمراض أو الأدوية.", "Food and sleep come first. Well-supported supplements: creatine monohydrate (3-5 g daily), protein powder to fill gaps, and moderate caffeine. Check with your doctor before any supplement, especially with conditions or medication.", "L'alimentation et le sommeil d'abord. Compléments bien étayés : créatine monohydrate (3-5 g/jour), protéine en poudre pour combler les manques, caféine modérée. Demande l'avis d'un médecin, surtout si tu as une maladie ou un traitement."]}, {"g": "m", "k": "nut", "t": ["توزيع البروتين", "Protein distribution", "Répartition des protéines"], "x": ["وزّع البروتين على 3 إلى 5 وجبات بنحو 0.3 إلى 0.4 غ لكل كغ في الوجبة. الاحتياج اليومي للمتدرب عادة من 1.6 إلى 2.2 غ لكل كغ.", "Spread protein across 3-5 meals at about 0.3-0.4 g/kg per meal. Daily needs for lifters are usually 1.6-2.2 g/kg.", "Répartis les protéines sur 3-5 repas, soit environ 0,3-0,4 g/kg par repas. بد والعدس والسبانخ، وتناولي معه مصدر فيتامين C (ليمون أو فلفل) لتحسين الامتصاص. إن شعرتِ بإرهاق مستمر فاطلبي تحليلاً بدل تناول مكملات عشوائية.", "Iron needs are higher in women. Sources: red meat, liver, lentils, spinach; pair with vitamin C (lemon, peppers) to improve absorption. If you feel constantly drained, get tested instead of taking random supplements.", "Les besoins en fer sont plus élevés chez la femme. Sources : viande rouge, foie, lentilles, épinards ; associe de la vitamine C (citron, poivron). En cas de fatigue persistante, fais un bilan plutôt que de prendre des compléments au hasard."]}]);

  function tgLoad(){ try{ const v = JSON.parse(localStorage.getItem('lhta-target') || 'null'); return v && v.kcal ? v : null; }catch(e){ return null; } }
  function tgCompute(d){
    const bmr = 10 * d.w + 6.25 * d.h - 5 * d.a + (d.s === 'm' ? 5 : -161);
    const tdee = bmr * [1.2, 1.375, 1.55, 1.725, 1.9][d.act];
    const adj = d.g === 'lose' ? 0.8 : d.g === 'gain' ? 1.1 : 1;
    const kcal = Math.round(Math.max(d.s === 'm' ? 1500 : 1200, tdee * adj));
    const p = Math.round(d.w * (d.g === 'gain' ? 1.8 : d.g === 'keep' ? 1.6 : 2));
    const f = Math.round(kcal * 0.25 / 9);
    const c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
    return { ...d, bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, p, c, f, bmi: +(d.w / Math.pow(d.h / 100, 2)).toFixed(1), water: +(d.w * 0.035).toFixed(1) };
  }

  // ---------- MEAL PLANNER (5 meals, macros solved per meal) ----------
  let mpSeed = 0, mpVeg = false;
  function mealPlanner(box){
    const T = tgLoad(); if(!T) return;
    const F = n => FOOD_DB.find(x => x.n === n);
    const nm = f => (currentLang==='en' && f.en) || (currentLang==='fr' && f.fr) || f.n;
    const POOL = {
      b:{P:['بيضة مسلوقة','زبادي يوناني','جبنة قريش','جبنة بيضاء'],C:['شوفان نيء','خبز أسمر','موز'],F:['لوز','زبدة فول سوداني','جوز'],V:['طماطم','خيار']},
      s:{P:['زبادي يوناني','جبنة قريش','بيضة مسلوقة'],C:['تفاح','موز','تمر','برتقال'],F:['لوز','جوز','بذور الشيا']},
      l:{P:['صدر دجاج مشوي','لحم بقري مشوي','سمك أبيض مشوي','تونة معلبة','عدس مطبوخ'],C:['أرز أبيض مطبوخ','كسكس مطبوخ','برغل مطبوخ','بطاطا مسلوقة','معكرونة مطبوخة'],F:['زيت زيتون','أفوكادو'],V:['سلطة خضراء','بروكلي مطبوخ']},
      d:{P:['سلمون مشوي','صدر ديك رومي مشوي','صدر دجاج مشوي','بيضة مسلوقة','فاصوليا بيضاء مطبوخة'],C:['بطاطا حلوة','أرز بني مطبوخ','خبز أسمر','كسكس مطبوخ'],F:['زيت زيتون','لوز'],V:['سلطة خضراء','كوسا','سبانخ مطبوخ']}
    };
    const VEG = ['بيضة مسلوقة','زبادي يوناني','جبنة قريش','جبنة بيضاء','عدس مطبوخ','فاصوليا بيضاء مطبوخة','حمص','فول مطبوخ'];
    const SPLIT = [['b',.25],['s',.10],['l',.30],['s',.10],['d',.25]];
    const TT = [['الفطور','Breakfast','Petit-déjeuner'],['سناك','Snack','Collation'],['الغداء','Lunch','Déjeuner'],['سناك','Snack','Collation'],['العشاء','Dinner','Dîner']];
    const det = m => m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1]) - m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0]) + m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
    const r5 = g => g < 20 ? Math.max(0, Math.round(g)) : Math.round(g/5)*5;
    function grams(P, C, Fa, goal){
      const M = [[P.p,C.p,Fa.p],[P.c,C.c,Fa.c],[P.f,C.f,Fa.f]].map(r => r.map(v => v/100)), D = det(M);
      let sol = Math.abs(D) > 1e-9 ? [0,1,2].map(i => det(M.map((r,k) => r.map((v,j) => j===i ? goal[k] : v)))/D) : null;
      if(!sol || sol.some(x => x < 0)){
        const gp = goal[0]/(P.p/100), gc = Math.max(0, (goal[1] - gp*P.c/100)/(C.c/100)), gf = Math.max(0, (goal[2] - gp*P.f/100 - gc*C.f/100)/(Fa.f/100));
        sol = [gp, gc, gf];
      }
      return [Math.min(350, sol[0]), Math.min(500, sol[1]), Math.min(Fa.f > 50 ? 30 : 60, sol[2])];
    }
    function build(){
      const out = []; let tot = {k:0,p:0,c:0,f:0};
      SPLIT.forEach(([key, sh], i) => {
        const pool = POOL[key], pp = (mpVeg ? pool.P.filter(x => VEG.includes(x)) : pool.P).map(F).filter(Boolean);
        const cc = pool.C.map(F).filter(Boolean), ff = pool.F.map(F).filter(Boolean), vv = (pool.V || []).map(F).filter(Boolean);
        if(!pp.length || !cc.length || !ff.length) return;
        const V = vv.length ? vv[(mpSeed + i) % vv.length] : null, gv = V ? (key === 'b' ? 80 : 150) : 0, gk = T.kcal*sh, cands = [];
        pp.forEach(P => cc.forEach(C => ff.forEach(Fa => {
          const goal = [T.p*sh, T.c*sh, T.f*sh];
          if(V){ goal[0] -= V.p*gv/100; goal[1] -= V.c*gv/100; goal[2] -= V.f*gv/100; }
          const cap = (f, s) => Math.min(s*gk/(f.kcal/100), f.n === 'بيضة مسلوقة' ? 150 : 400), g = grams(P, C, Fa, goal);
          const gr = [Math.min(g[0], cap(P,.6)), Math.min(g[1], cap(C,.75)), Math.min(g[2], cap(Fa,.3), Fa.f > 50 ? 30 : 60)].map(r5);
          const items = [[P,gr[0]],[C,gr[1]],[Fa,gr[2]]].filter(x => x[1] > 0); if(V) items.push([V,gv]);
          const m = items.reduce((a,[f,q]) => ({k:a.k+f.kcal*q/100,p:a.p+f.p*q/100,c:a.c+f.c*q/100,f:a.f+f.f*q/100}), {k:0,p:0,c:0,f:0});
          const err = Math.abs(m.k-gk)/gk + Math.abs(m.p-T.p*sh)/(T.p*sh) + Math.abs(m.c-T.c*sh)/Math.max(T.c*sh,10)*.5 + Math.abs(m.f-T.f*sh)/Math.max(T.f*sh,5)*.5;
          cands.push({items, m, err});
        })));
        cands.sort((x,y) => x.err - y.err);
        const top = cands.slice(0, 5), {items, m} = top[(mpSeed + i) % top.length];
        Object.keys(tot).forEach(x => tot[x] += m[x]);
        out.push({t:TT[i], items, m});
      });
      return {out, tot};
    }
    function draw(){
      const {out, tot} = build(), u = t('gramsUnit'), diff = Math.round(tot.k - T.kcal);
      const cards = out.map((o,i) => `<div class="meal-card"><div class="meal-head"><span class="meal-num">${i+1}</span><div><div class="meal-title">${tr3(...o.t)}</div></div></div>

        <ul class="meal-items">${o.items.map(([f,g]) => `<li><b>${nm(f)}</b> — ${g}${u}${f.n === 'بيضة مسلوقة' ? ' (≈' + Math.max(1, Math.round(g/50)) + ')' : ''}</li>`).join('')}</ul></div>`).join('');
      wrap.innerHTML = `<div class="tg-head"><h3>🍽️ ${tr3('مخطط الوجبات اليومي','Daily meal planner','Planificateur de repas')}</h3><small>${tr3('5 وجبات موزعة: 25% · 10% · 30% · 10% · 25% من احتياجك','5 meals split 25% · 10% · 30% · 10% · 25% of your needs','5 repas répartis 25 % · 10 % · 30 % · 10 % · 25 % de tes besoins')}</small></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button type="button" class="btn small" id="mpShuf">🔄 ${tr3('بدّل الوجبات','Shuffle meals','Changer les repas')}</button><button type="button" class="btn small ${mpVeg ? 'primary' : ''}" id="mpVeg">🥚 ${tr3('بدون لحوم ودواجن وأسماك','No meat/poultry/fish','Sans viande/volaille/poisson')}</button></div>
        <div class="meal-grid">${cards}</div>
        <p class="tg-note"><b>${tr3('المجموع','Total','Total')}: ${Math.round(tot.k)} ${t('kcalLabel')} (${diff > 0 ? '+' : ''}${diff} ${tr3('عن الهدف','vs target','vs objectif')}) · ${t('proteinLabel')} ${Math.round(tot.p)}${u} · ${t('carbsLabel')} ${Math.round(tot.c)}${u} · ${t('fatLabel')} ${Math.round(tot.f)}${u}</b><br>${tr3('الأساس العلمي: BMR بمعادلة Mifflin-St Jeor × عامل النشاط، عجز 20% للتنشيف وفائض 10% للبناء، بروتين 1.6–2 غ/كغ، دهون 25% من السعرات والباقي كربوهيدرات؛ ثم تُحسب كمية كل صنف بحل معادلات الماكروز لكل وجبة. الأوزان للطعام المطبوخ/الجاهز، وهي تقديرية. لا تناسب الحوامل أو المرضى أو القاصرين: استشر طبيباً أو مختص تغذية.','Science: Mifflin-St Jeor BMR × activity factor, 20% deficit to cut and 10% surplus to build, protein 1.6–2 g/kg, fat 25% of calories, carbs the remainder; each food quantity is then solved from the per-meal macro equations. Weights are for cooked/ready food and approximate. Not for pregnancy, medical conditions or minors: ask a doctor or dietitian.','Base scientifique : BMR Mifflin-St Jeor × facteur d’activité, déficit 20 % pour sécher et excédent 10 % pour prendre, protéines 1,6–2 g/kg, lipides 25 % des calories, glucides le reste ; chaque quantité est calculée en résolvant les équations de macros par repas. Poids cuits/prêts, approximatifs. Non adapté à la grossesse, aux maladies ou aux mineurs : demande un médecin ou un diététicien.')}</p>`;
      wrap.querySelector('#mpShuf').onclick = () => { mpSeed++; draw(); };
      wrap.querySelector('#mpVeg').onclick = () => { mpVeg = !mpVeg; draw(); };
    }
    const wrap = document.createElement('div'); wrap.className = 'tg-card'; wrap.style.marginTop = '16px'; box.appendChild(wrap); draw();
  }
  function renderTarget(){
    const box = document.getElementById('tgBox'); if(!box) return;

  function voiceInit(box, email, role){
    const T = VOT[currentLang] || VOT.ar, hdr = role === 'coach' ? { 'x-admin-password': adminPassword } : { 'x-member-email': email };
    const URLV = `${API_BASE}/api/plan/vip/voice`;
    let rec = null, chunks = [], blob = null, timer = null, secs = 0, stream = null;
    box.innerHTML = `<div class="vo-box"><h4>${T.t}</h4><div class="vo-list"></div><div class="vo-ctl"><button type="button" class="btn small ghost vo-r">${T.rec}</button><span class="vo-time" hidden>0:00</span><audio class="vo-p" controls hidden></audio><button type="button" class="btn small primary vo-s" hidden>${T.send}</button><button type="button" class="btn small ghost vo-c" hidden>${T.cancel}</button></div><p class="vx-note vo-m" role="status"></p></div>`;
    const q = c => box.querySelector(c), msg = t => { q('.vo-m').textContent = t || ''; };
    const rBtn = q('.vo-r'), tm = q('.vo-time'), pv = q('.vo-p'), sBtn = q('.vo-s'), cBtn = q('.vo-c');
    const fmt = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
    function reset(){ blob = null; chunks = []; secs = 0; pv.hidden = sBtn.hidden = cBtn.hidden = tm.hidden = true; pv.removeAttribute('src'); rBtn.hidden = false; rBtn.textContent = T.rec; rBtn.classList.remove('vo-rec'); }
    async function load(){
      const L = q('.vo-list');
      try{
        const r = await fetch(`${URLV}/${encodeURIComponent(email)}`, { headers: hdr });
        if(!r.ok) throw new Error(r.status);
        const items = ((await r.json()).notes || []).filter(n => typeof n.audio === 'string' && n.audio.startsWith('data:audio/'));
        L.innerHTML = items.length ? items.slice().reverse().map(n => `<div class="vo-item ${n.from_role === 'coach' ? 'coach' : 'member'}"><b>${n.from_role === 'coach' ? T.coach : T.client}</b> · ${new Date(n.created_at).toLocaleString(currentLang === 'ar' ? 'ar-EG' : currentLang)} · ${fmt(+n.duration || 0)}<audio controls preload="none" src="${escapeHtml(n.audio)}"></audio></div>`).join('') : `<div class="vo-item">${T.none}</div>`;
      }catch(e){ L.innerHTML = `<div class="vo-item">${T.none}</div>`; }
    }
    function stopRec(){ clearInterval(timer); if(rec && rec.state !== 'inactive') rec.stop(); }
    rBtn.onclick = async () => {
      if(rec && rec.state === 'recording'){ stopRec(); return; }
      msg('');
      if(!navigator.mediaDevices || !window.MediaRecorder){ msg(micMsg(null, true)); return; }
      try{ stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }catch(e){ msg(micMsg(e)); return; }
      const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported(m));
      rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 16000 } : { audioBitsPerSecond: 16000 });
      chunks = []; secs = 0;
      rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        blob = new Blob(chunks, { type: rec.mimeType || mime || 'audio/webm' });
        pv.src = URL.createObjectURL(blob); pv.hidden = sBtn.hidden = cBtn.hidden = false; rBtn.hidden = true; rBtn.classList.remove('vo-rec');
      };
      rec.start();
      rBtn.textContent = T.stop; rBtn.classList.add('vo-rec'); tm.hidden = false; tm.textContent = '0:00';
      timer = setInterval(() => { secs++; tm.textContent = fmt(secs); if(secs >= 90){ stopRec(); msg(T.max); } }, 1000);
    };
    cBtn.onclick = reset;
    sBtn.onclick = () => {
      if(!blob) return;
      const fr = new FileReader();
      fr.onload = async () => {
        if(fr.result.length > 700000){ msg(T.big); return; }
        sBtn.disabled = true;
        try{
          const r = await fetch(URLV, { method:'POST', headers: Object.assign({ 'Content-Type':'application/json' }, hdr), body: JSON.stringify({ email, audio: fr.result, duration: secs }) });
          if(r.status === 404 || r.status === 405){ msg(T.nosrv + ' (' + r.status + ')'); }
          else if(r.status === 413){ msg(T.big + ' (413)'); }
          else if(!r.ok){ msg(T.err + ' (' + r.status + ')'); }
          else { msg(T.sent); reset(); load(); }
        }catch(e){ msg(T.err + ' (' + ((e && e.message) || 'network') + ')'); }
        sBtn.disabled = false;
      };
      fr.readAsDataURL(blob);
    };
    load();
  }

  function hbKey(off){ const d = new Date(); d.setDate(d.getDate() - (off || 0)); return d.toLocaleDateString('en-CA'); }
  function hbLoad(){ try{ const v = JSON.parse(localStorage.getItem('lhta-habits') || '{}'); return v && typeof v === 'object' ? v : {}; }catch(e){ return {}; } }
  function hbScore(e){ e = e || {}; return (e.w >= 8 ? 1 : 0) + (e.s ? 1 : 0) + (e.z ? 1 : 0) + (e.t ? 1 : 0); }
  function hbStreak(m){ let n = 0, off = hbScore(m[hbKey(0)]) >= 3 ? 0 : 1; while(hbScore(m[hbKey(off)]) >= 3){ n++; off++; } return n; }
  function renderHabits(area){
    const T = HBT[currentLang] || HBT.ar, box = document.createElement('div'); box.className = 'tg-card';
    area.prepend(box);
    function draw(){
      const m = hbLoad(), k = hbKey(0), e = m[k] || { w:0, s:0, z:0, t:0 };
      const tog = (f, l) => `<div class="hb-row"><span>${l}</span><button type="button" class="hb-tog${e[f] ? ' on' : ''}" data-f="${f}" aria-pressed="${!!e[f]}">${e[f] ? '✓' : '○'}</button></div>`;
      const strip = [6, 5, 4, 3, 2, 1, 0].map(o => { const d = new Date(); d.setDate(d.getDate() - o); return `<div class="hb-day"><i class="${hbScore(m[hbKey(o)]) >= 3 ? 'on' : ''}"></i>${d.toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : currentLang, { weekday:'narrow' })}</div>`; }).join('');
      box.innerHTML = `<div class="tg-head"><h3>${T.t}</h3><small>${T.streak}: <b>${hbStreak(m)}</b> ${T.d}</small></div>
        <div class="hb-row"><span>${T.water}</span><span><button type="button" class="btn small ghost" data-w="-1" aria-label="-">−</button> <b style="display:inline-block;min-width:34px;text-align:center">${e.w || 0}/8</b> <button type="button" class="btn small ghost" data-w="1" aria-label="+">+</button></span></div>
        ${tog('s', T.steps)}${tog('z', T.sleep)}${tog('t', T.train)}<div class="hb-strip">${strip}</div><p class="tg-note">${T.hint}</p>`;
      const save = () => { m[k] = e; try{ localStorage.setItem('lhta-habits', JSON.stringify(m)); }catch(x){console.warn(x)} draw(); };
      box.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { e[b.dataset.f] = e[b.dataset.f] ? 0 : 1; save(); });
      box.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { e.w = Math.max(0, Math.min(12, (e.w || 0) + (+b.dataset.w))); save(); });
    }
    draw();
  }

          <div>🏋️ جلسات آخر 7 أيام: <b>${r.sessions7 || 0}</b> · آخر تسجيل: ${r.last_log ? fd(r.last_log) : 'لم يسجّل بعد'}${(ago(r) === null || ago(r) > 5) ? ` · <a class="btn small ghost" href="${waLink((r.data || {}).phone)}?text=${encodeURIComponent('مرحباً، لاحظت أنك لم تسجّل تمرينك منذ فترة. هل تحتاج تعديلاً على البرنامج؟')}" target="_blank" rel="noopener">⚠️ تذكير واتساب</a>` : ''}</div>
          ${r.expires_at ? `⏳ ينتهي: <b>${fd(r.expires_at)}</b> <span class="vip-days ${dl(r) <= 5 ? 'warn' : ''}">${dl(r) > 0 ? 'متبقي ' + dl(r) + ' يوم' : 'منتهي'}</span>` : ''}
          <div class="vv" data-email="${escapeHtml(r.email)}"></div><div class="vt-row"><select class="calc-search vtpl">${tplOpts()}</select><button type="button" class="btn small ghost vtplsave">حفظ كقالب</button><button type="button" class="btn small ghost vtpldel">حذف قالب</button></div><textarea class="calc-search vprog" rows="5" placeholder="اكتب برنامج العضو هنا (التمارين، المجموعات، العدات...)" style="margin:8px 0">${escapeHtml(r.program || '')}</textarea>
          <button class="btn small ghost vgen">⚡ توليد مسودة تلقائية</button> <button class="btn small primary vsaveprog">حفظ البرنامج</button>
          ${vipProgress(r.checkins || [], VT.ar, (r.data || {}).goal)}${(r.checkins || []).map(c => `<div style="margin-top:10px">📈 ${fd(c.created_at)} · <b>${escapeHtml(c.weight)} كغ</b>${c.note ? ' — ' + escapeHtml(c.note) : ''} <button type="button" class="btn small ghost vcdel" data-c="${c.id}" style="margin-inline-start:6px;color:#ff4757">🗑</button><br>
            ${localStorage.getItem('lhta-rlog:' + c.id) ? `<small class="rlog" style="color:var(--ink-dim)">ردّيت: ${new Date(localStorage.getItem('lhta-rlog:' + c.id)).toLocaleString('ar-EG')}</small><br>` : ''}<input class="calc-search vrep" data-c="${c.id}" placeholder="ردك على المتابعة" value="${escapeHtml(c.reply || '')}" style="margin:6px 0"><button class="btn small ghost vrepbtn" data-c="${c.id}">إرسال الرد</button><div class="vq-row" style="margin-top:6px">${QR.map(x => `<button type="button" class="vq">${x}</button>`).join('')}</div></div>`).join('')}
        </div>`;
      const ord = {pending:0, accepted:1, rejected:2};
      reqs.sort((x, y) => (ord[x.status] - ord[y.status]) || (new Date(y.created_at) - new Date(x.created_at)));
      const cnt = k => reqs.filter(r => r.status === k).length;
      const bar = `<div class="vip-filter">${[].concat([['all','الكل',reqs.length],['pending','⏳ قيد المراجعة',cnt('pending')],['accepted','✅ مقبول',cnt('accepted')],['rejected','❌ مرفوض',cnt('rejected')]], adminFlagBtns(reqs)).map(f => `<button class="btn small ${f[0]==='all'?'on':''}" data-f="${f[0]}">${f[1]} (${f[2]})</button>`).join('')}</div><button type="button" class="btn small ghost" id="vCsv" style="margin-bottom:12px">تصدير CSV</button><input class="calc-search" id="vFilterQ" placeholder="بحث بالاسم أو الإيميل" style="margin-bottom:12px">`;
      area.innerHTML = (reqs.length ? bar : '') + (reqs.length ? reqs.map(r => { const d = r.data || {}; return `
        <div class="vip-req" data-id="${r.id}" data-status="${r.status}" data-flags="${adminFlags(r)}" data-q="${escapeHtml((r.name + ' ' + r.email).toLowerCase())}">
          <b>${escapeHtml(r.name)}</b> · ${escapeHtml(r.email)} · ${new Date(r.created_at).toLocaleString('ar-EG')} <button type="button" class="btn small ghost vext" data-id="${r.id}" style="margin-inline-start:8px">➕ 30 يوم</button> <button type="button" class="btn small ghost vreqdel" data-id="${r.id}" style="margin-inline-start:8px;color:#ff4757">🗑 حذف</button><br>
          📞 ${escapeHtml(d.phone)} · 💳 ${escapeHtml(d.sender)}${d.receipt ? ` · <a href="#" class="vrec" data-r="${d.receipt}" style="color:var(--gold)">🧾 الوصل</a>` : ''}
          <a class="btn small primary" href="${waLink(d.phone)}" target="_blank" rel="noopener" style="margin-inline-start:8px">واتساب</a><br>
          ${d.h ? `الطول ${escapeHtml(d.h)} · الوزن ${escapeHtml(d.w)} · العمر ${escapeHtml(d.age)} · ${d.sex === 'm' ? 'ذكر' : 'أنثى'}<br>
          الهدف: ${G[d.goal] || ''} · ${escapeHtml(d.days)} أيام/أسبوع · الشدة: ${I[d.intensity] || ''}<br>
          السعرات: <b>${escapeHtml(d.kcal)}</b> · بروتين ${escapeHtml(d.protein)}غ · نوم ${escapeHtml(d.sleep)} ساعات<br>${d.med === 'y' ? `⚠️ <b style="color:#ff4757">إصابة/حالة طبية — راجع قبل الاعتماد</b>${d.inj ? ': ' + escapeHtml(d.inj) : ''}${(d.parq || []).length ? ' · PAR-Q: ' + d.parq.map(Number).join('،') : ''}<br>` : ''}${(d.photoIds||[]).length ? `📷 صور اختيارية: ${(d.photoIds||[]).map((id,i)=>`<a href="#" class="vrec" data-r="${id}" style="color:var(--gold);margin-inline-end:6px">عرض ${i+1}</a>`).join('')}<br>` : ''}${d.bfSelf ? `دهون صرّح بها العضو: ${escapeHtml(d.bfSelf)}%<br>` : ''}${vipBreakdown(d)}${d.bf ? 'دهون تقديرية ~' + escapeHtml(d.bf) + '% · ' : ''}${(d.weak || []).length ? 'أولوية: ' + d.weak.map(w => escapeHtml((VM[w] || [w])[0])).join('، ') : ''}<br>` : ''}
          <b>${S[r.status]}</b>${r.note ? ' — ' + escapeHtml(r.note) : ''}
          ${accBlock(r)}${r.status === 'accepted' ? `<button type="button" class="btn small ghost vvoice" data-n="${escapeHtml(r.name)}" data-p="${escapeHtml((r.data || {}).phone || '')}" data-id="${r.id}" style="margin-top:10px">🎙️ رسالة صوتية</button>` : ''}<textarea class="calc-search vcn" data-id="${r.id}" rows="2" placeholder="ملاحظة خاصة بالمدرب (لا يراها العضو)" style="margin:10px 0 0">${escapeHtml(localStorage.getItem('lhta-cnote:' + r.id) || '')}</textarea>${r.status === 'pending' ? `<div style="margin-top:8px"><input class="calc-search vnote" placeholder="رسالة للعضو (اختياري)" style="margin-bottom:8px">
            <button class="btn small primary vdec" data-s="accepted">قبول</button> <button class="btn small ghost vdec" data-s="rejected">رفض</button></div>` : ''}
        </div>`; }).join('') : '<div class="log-empty">لا توجد طلبات بعد</div>');
      area.querySelectorAll('.vsaveprog').forEach(btn => {
        btn.onclick = async () => {
          const box = btn.closest('.vip-req');
          await fetch(`${API_BASE}/api/plan/vip/${box.dataset.id}/program`, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-password': adminPassword }, body: JSON.stringify({ program: box.querySelector('.vprog').value }) });
          alert('تم الحفظ');
        };
      });
      area.querySelectorAll('.vrepbtn').forEach(btn => {
        btn.onclick = async () => {
          const inp = btn.parentElement.querySelector('.vrep');
          let rs; try{ rs = await fetch(`${API_BASE}/api/plan/vip/checkin/${btn.dataset.c}/reply`, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-password': adminPassword }, body: JSON.stringify({ reply: inp.value }) }); }catch(e){console.warn(e)}
          if(!rs || !rs.ok){ alert('تعذر الإرسال، حاول مرة أخرى'); return; }
          const now = new Date().toISOString();
          try{ localStorage.setItem('lhta-rlog:' + btn.dataset.c, now); }catch(e){console.warn(e)}
          let sm = btn.parentElement.querySelector('.rlog');
          if(!sm){ sm = document.createElement('small'); sm.className = 'rlog'; sm.style.color = 'var(--ink-dim)'; inp.before(sm); sm.after(document.createElement('br')); }
          sm.textContent = 'ردّيت: ' + new Date(now).toLocaleString('ar-EG');
          alert('تم الإرسال');
        };
      });
      area.querySelectorAll('.vdec').forEach(btn => {
        btn.onclick = async () => {
          const box = btn.closest('.vip-req');
          await fetch(`${API_BASE}/api/plan/vip/${box.dataset.id}/decision`, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-password': adminPassword }, body: JSON.stringify({ status: btn.dataset.s, note: box.querySelector('.vnote').value }) });
          renderAdminView();
        };
      });
      area.querySelectorAll('.vext').forEach(btn => btn.onclick = async () => {
        if(!confirm('تمديد الاشتراك 30 يوماً؟')) return;
        let rs; try{ rs = await fetch(`${API_BASE}/api/activity/extend`, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-password': adminPassword }, body: JSON.stringify({ id: +btn.dataset.id, days: 30 }) }); }catch(e){console.warn(e)}
        if(!rs || !rs.ok){ alert('تعذر التمديد'); return; }
        renderAdminView();
      });
      area.querySelectorAll('.vreqdel').forEach(btn => btn.onclick = async () => {
        if(!confirm('حذف هذا المشترك وكل بياناته (المتابعات، سجل التمارين، وصل الدفع) نهائياً؟')) return;
        let rs; try{ rs = await fetch(`${API_BASE}/api/plan/vip/${btn.dataset.id}`, { method:'DELETE', headers:{ 'x-admin-password': adminPassword } }); }catch(e){console.warn(e)}
        if(!rs || !rs.ok){ alert('تعذر الحذف'); return; }
        renderAdminView();
      });
      area.querySelectorAll('.vcdel').forEach(btn => btn.onclick = async () => {
        if(!confirm('حذف هذه المتابعة؟')) return;
        let rs; try{ rs = await fetch(`${API_BASE}/api/plan/vip/checkin/${btn.dataset.c}`, { method:'DELETE', headers:{ 'x-admin-password': adminPassword } }); }catch(e){console.warn(e)}
        if(!rs || !rs.ok){ alert('تعذر الحذف'); return; }
        renderAdminView();
      });
      area.querySelectorAll('.vrec').forEach(a => a.onclick = async ev => {
        ev.preventDefault(); const w = window.open('', '_blank');
        const rs = await fetch(`${API_BASE}/api/plan/vip/receipt/${a.dataset.r}`, { headers:{ 'x-admin-password': adminPassword } });
        if(!rs.ok){ if(w) w.close(); alert('تعذر فتح الوصل'); return; }
        const url = URL.createObjectURL(await rs.blob()); if(w) w.location = url; else window.open(url, '_blank');
      });
      area.querySelectorAll('.vgen').forEach(btn => btn.onclick = () => {
        const box = btn.closest('.vip-req'), r = reqs.find(x => String(x.id) === box.dataset.id), ta = box.querySelector('.vprog');
        if(ta.value.trim() && !confirm('استبدال البرنامج الحالي بالمسودة؟')) return;
        ta.value = vipGen(r.data || {});
      });
      vipFilterInit(area);
      document.getElementById('vCsv').onclick = () => adminVipCsv(reqs);
      area.querySelectorAll('.vv').forEach(b => voiceInit(b, b.dataset.email, 'coach'));
    } else if(activeAdminTab === 'stats'){
      let st = {};
      try{ st = await (await fetch(`${API_BASE}/api/admin/stats`, { headers:{ 'x-admin-password': adminPassword } })).json(); }catch(e){console.warn(e)}
      const it = (l, v) => `<div class="summary-item"><span class="slabel">${l}</span><span class="sval">${v ?? '—'}</span></div>`;
      area.innerHTML = `<div class="summary-bar">${it('إجمالي الأعضاء', st.members)}${it('جدد آخر 7 أيام', st.week)}${it('طلبات VIP بالانتظار', st.pending)}${it('VIP مقبولة', st.accepted)}${it('كل طلبات VIP', st.total)}</div>`;
    adminInsights(area);
    } else if(activeAdminTab === 'nutrition'){
      const plan = await loadPlan();
      const n = plan.nutrition;
      area.innerHTML = `
        <div class="edit-day">
          <div class="day-title">الإعدادات العامة</div>
          <div class="edit-grid">
            <div class="field"><label>السعرات اليومية</label><input id="nutKcal" value="${escapeHtml(n.dailyCalories)}"></div>
            <div class="field"><label>البروتين المستهدف</label><input id="nutProtein" value="${escapeHtml(n.proteinTarget)}"></div>
          </div>
        </div>
      ` + n.meals.map((m,i) => `
        <div class="edit-day">
          <div class="day-title">وجبة ${i+1}: ${escapeHtml(m.title)}</div>
          <div class="edit-grid">
            <div class="field"><label>اسم الوجبة (عربي)</label><input data-mi="${i}" data-mf="title" value="${escapeHtml(m.title)}"></div>
            <div class="field"><label>اسم الوجبة (En/Fr)</label><input data-mi="${i}" data-mf="titleEn" value="${escapeHtml(m.titleEn)}"></div>
            <div class="field"><label>سعرات (kcal)</label><input data-mi="${i}" data-mf="kcal" type="number" value="${m.kcal}"></div>
            <div class="field"><label>بروتين (غ)</label><input data-mi="${i}" data-mf="p" type="number" value="${m.p}"></div>
            <div class="field"><label>كارب (غ)</label><input data-mi="${i}" data-mf="c" type="number" value="${m.c}"></div>
            <div class="field"><label>دهون (غ)</label><input data-mi="${i}" data-mf="f" type="number" value="${m.f}"></div>
          </div>
          <div class="field"><label>عناصر الوجبة — سطر لكل عنصر بالصيغة: التسمية|التفاصيل</label><textarea data-mi="${i}" data-mf="items" rows="4">${escapeHtml(itemsToText(m.items))}</textarea></div>
        </div>
      `).join('') + `
        <div class="edit-day">
          <div class="day-title">قواعد عامة (تظهر أسفل صفحة التغذية)</div>
          <div class="field"><label>سطر لكل قاعدة بالصيغة: العنوان|النص</label><textarea id="nutRules" rows="4">${escapeHtml((n.rules||[]).map(r => r.title+'|'+r.text).join('\n'))}</textarea></div>
        </div>
      ` + `<button class="btn primary" id="saveNutrition">حفظ التعديلات</button>`;

      document.getElementById('saveNutrition').onclick = async () => {
        n.dailyCalories = document.getElementById('nutKcal').value;
        n.proteinTarget = document.getElementById('nutProtein').value;
        area.querySelectorAll('[data-mi]').forEach(el => {
          const i = +el.dataset.mi, f = el.dataset.mf;
          if(f === 'items'){ n.meals[i].items = textToItems(el.value); }
          else if(f === 'kcal' || f === 'p' || f === 'c' || f === 'f'){ n.meals[i][f] = +el.value || 0; }
          else{ n.meals[i][f] = el.value; }
        });
        n.rules = document.getElementById('nutRules').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          const idx = l.indexOf('|');
          return idx === -1 ? { title:l, text:'' } : { title:l.slice(0,idx).trim(), text:l.slice(idx+1).trim() };
        });
        await savePlan(plan);
        alert('تم الحفظ');
      };
    }
  }

  // ---------- static text translation ----------
  function applyStaticI18n(){
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      el.innerHTML = t(key);
    });
  }

  // ---------- dispatcher ----------
  function renderApp(){
    applyLangDirection();
    renderTopbar();
    applyStaticI18n();
    if(isAdmin) renderAdminView();
    else renderPublicView();
  }

  // ---------- hidden admin trigger (اضغط 3 مرات على LA) ----------
  let laClickCount = 0, laClickTimer = null;
  document.getElementById('adminLA').onclick = () => {
    laClickCount++;
    clearTimeout(laClickTimer);
    laClickTimer = setTimeout(() => { laClickCount = 0; }, 900);
    if(laClickCount >= 3){
      laClickCount = 0;
      openModal('adminBackdrop');
    }
  };

  // ---------- modal helpers ----------
  function openModal(id){ document.getElementById(id).classList.add('open'); }
  function closeModal(id){
    document.getElementById(id).classList.remove('open');
    const err = document.getElementById(id).querySelector('.error');
    if(err) err.textContent = '';
  }
  document.getElementById('regCancel').onclick = () => closeModal('registerBackdrop');
  document.getElementById('logCancel').onclick = () => closeModal('loginBackdrop');
  document.getElementById('adminCancel').onclick = () => closeModal('adminBackdrop');
  document.getElementById('toLogin').onclick = () => { closeModal('registerBackdrop'); openModal('loginBackdrop'); };
  document.getElementById('toRegister').onclick = () => { closeModal('loginBackdrop'); openModal('registerBackdrop'); };
  ['registerBackdrop','loginBackdrop','adminBackdrop'].forEach(id => {
    document.getElementById(id).addEventListener('click', (e) => { if(e.target.id === id) closeModal(id); });
  });

  // ---------- settings drawer ----------
  document.getElementById('settingsBtn').onclick = () => {
    document.getElementById('settingsBackdrop').classList.add('open');
    document.getElementById('settingsDrawer').classList.add('open');
    document.querySelectorAll('.lang-options button').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  };
  function closeDrawer(){
    document.getElementById('settingsDrawer').classList.remove('open');
    setTimeout(() => document.getElementById('settingsBackdrop').classList.remove('open'), 300);
  }
  document.getElementById('settingsClose').onclick = closeDrawer;
  document.getElementById('settingsBackdrop').addEventListener('click', (e) => {
    if(e.target.id === 'settingsBackdrop') closeDrawer();
  });
  document.querySelectorAll('.lang-options button').forEach(btn => {
    btn.onclick = () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem('lhta-lang', currentLang);
      document.querySelectorAll('.lang-options button').forEach(b => b.classList.toggle('active', b === btn));
      renderApp();
    };
  });

  function persistUser(user){
    currentUser = user;
    localStorage.setItem('lhta-user', JSON.stringify(user));
  }

  // استرجاع جلسة المستخدم المحفوظة محليًا (إن وجدت)
  try{
    const savedUser = localStorage.getItem('lhta-user');
    if(savedUser) currentUser = JSON.parse(savedUser);
  }catch(e){console.warn(e)}

  // ---------- تسجيل حساب جديد بالإيميل ----------
  document.getElementById('regSubmit').onclick = async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const pass = document.getElementById('regPass').value;
    const errEl = document.getElementById('regError');
    if(!name || !email || !pass){ errEl.textContent = 'عبّي كل الحقول من فضلك'; return; }
    const { ok, data } = await apiPost('/api/auth/register', { name, email, password: pass });
    if(!ok){ errEl.textContent = data.error || 'تعذر التسجيل، حاول مرة أخرى'; return; }
    persistUser(data.user);
    document.getElementById('regName').value = '';
    document.getElementById('regEmail').value = '';
    document.getElementById('regPass').value = '';
    closeModal('registerBackdrop');
    renderApp();
  };

  // ---------- تسجيل الدخول بالإيميل ----------
  document.getElementById('logSubmit').onclick = async () => {
    const email = document.getElementById('logEmail').value.trim().toLowerCase();
    const pass = document.getElementById('logPass').value;
    const errEl = document.getElementById('logError');
    const { ok, data } = await apiPost('/api/auth/login', { email, password: pass });
    if(!ok){ errEl.textContent = data.error || 'الإيميل أو كلمة المرور غير صحيحة'; return; }
    persistUser(data.user);
    document.getElementById('logEmail').value = '';
    document.getElementById('logPass').value = '';
    closeModal('loginBackdrop');
    renderApp();
  };

  // ---------- دخول المشرف (حقيقي عبر الخادم) ----------
  document.getElementById('adminSubmit').onclick = async () => {
    const pass = document.getElementById('adminPass').value;
    const errEl = document.getElementById('adminError');
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pass })
    });
    if(!res.ok){ errEl.textContent = 'كلمة مرور غير صحيحة'; return; }
    adminPassword = pass;
    sessionStorage.setItem('lhta-admin-pass', pass);
    isAdmin = true;
    document.getElementById('adminPass').value = '';
    closeModal('adminBackdrop');
    renderApp();
  };

  renderApp();
</script>

<script>
(function(){
  const LS = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } };
  const SV = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){console.warn(e)} };
  const L = () => { const l = typeof currentLang !== 'undefined' ? currentLang : (localStorage.getItem('lhta-lang') || 'ar'); return D[l] ? l : 'ar'; };

function program(){
  if(!document.getElementById('ckW'))return;
  var hs=document.querySelectorAll('.vip-card > h3.vip-h');
  for(var i=0;i<hs.length;i++){var h=hs[i];if(h.textContent.indexOf('📋')!==0)continue;
    var card=h.parentElement;if(card.dataset.lx)continue;
    var pre=card.querySelector('div[style*="pre-wrap"]');if(!pre)continue;
    var days=parse(pre.textContent),n=0;days.forEach(function(d){n+=d.ex.length;});if(n<2)continue;
    card.dataset.lx='1';build(card,pre,days);}
}

/* ---- check-in: sleep/energy/sessions + latest measurements in the note, optional progress photo ---- */
function checkin(){
  var btn=document.getElementById('ckSend');if(!btn||document.getElementById('lxCk'))return;
  var n7=G('lhta-days',[]).filter(function(s){return Date.now()-new Date(s).getTime()<7*864e5;}).length;
  var c=document.createElement('div');c.id='lxCk';c.className='vip-form';c.style.marginTop='10px';
  c.innerHTML='<label>😴 '+T('متوسط النوم (ساعات)','Avg sleep (hours)','Sommeil moyen (h)')+'<input class="calc-search" id="lxSl" type="number" step="0.5" min="0" max="14"></label><label>⚡ '+T('مستوى الطاقة (1-5)','Energy (1-5)','Énergie (1-5)')+'<input class="calc-search" id="lxEn" type="number" min="1" max="5"></label><label class="full">✅ '+T('عدد حصصك هذا الأسبوع','Sessions this week','Séances cette semaine')+'<input class="calc-search" id="lxAd" type="number" min="0" max="14" value="'+n7+'"></label><label class="full">📸 '+T('صورة تقدّمك (اختياري)','Progress photo (optional)','Photo de progrès (optionnel)')+'<input class="calc-search" id="lxPh" type="file" accept="image/*"></label>';
  btn.before(c);
}
function shrink(f,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.7));};im.src=r.result;};r.readAsDataURL(f);}
document.addEventListener('click',function(e){
  if(!(e.target.closest&&e.target.closest('#ckSend')))return;
  var n=document.getElementById('ckN');if(!n||n.value.indexOf(' [')>-1)return;
  var g=function(i){var el=document.getElementById(i);return el&&el.value;},p=[];
  if(g('lxSl'))p.push(T('نوم ','sleep ','sommeil ')+g('lxSl')+'h');if(g('lxEn'))p.push(T('طاقة ','energy ','énergie ')+g('lxEn')+'/5');if(g('lxAd'))p.push(T('حصص ','sessions ','séances ')+g('lxAd'));
  var m=G('lhta-meas:'+(E()||'me'),[]).slice(-1)[0];
  if(m){if(m.w)p.push(T('خصر ','waist ','taille ')+m.w);if(m.c)p.push(T('صدر ','chest ','poitrine ')+m.c);if(m.a)p.push(T('ذراع ','arm ','bras ')+m.a);}
  if(p.length)n.value=(n.value.trim().slice(0,380)+' ['+p.join(' · ')+']').trim();
  var f=document.getElementById('lxPh');f=f&&f.files[0];
  if(f&&E())shrink(f,function(img){api('/api/plan/vip/photo','POST',{email:E(),image:img}).catch(function(){});});
},true);

/* ---- backup / restore ---- */
function backup(){
  var ck=document.getElementById('ckW'),card=ck&&ck.closest('.vip-card');
  if(!card||document.getElementById('lxBk'))return;
  var d=document.createElement('div');d.id='lxBk';d.className='vip-card';
  d.innerHTML='<h3 class="vip-h">💾 '+T('نسخة احتياطية لبياناتك','Back up your data','Sauvegarde de tes données')+'</h3><p style="font-size:.82rem;opacity:.8;margin:0 0 10px">'+T('بياناتك تُزامَن تلقائياً مع حسابك عند توفر الخدمة، ويمكنك أيضاً حفظ نسخة يدوية.','Your data syncs to your account when available; you can also save a manual copy.','Tes données se synchronisent avec ton compte quand le service est disponible ; tu peux aussi sauvegarder une copie.')+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn vip-btn" id="lxEx" style="width:auto">⬇️ '+T('حفظ نسخة','Save copy','Sauvegarder')+'</button><label class="btn vip-btn" style="width:auto;cursor:pointer">⬆️ '+T('استعادة','Restore','Restaurer')+'<input type="file" id="lxIm" accept="application/json" hidden></label></div>';
  card.after(d);
  d.querySelector('#lxEx').onclick=function(){var o={};
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('lhta')===0&&k!=='lhta-user'&&k.indexOf('lhta-vipseen')!==0)o[k]=localStorage.getItem(k);}
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='lht-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();};
  d.querySelector('#lxIm').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var o=JSON.parse(r.result);Object.keys(o).forEach(function(k){if(k.indexOf('lhta')===0&&k!=='lhta-user')localStorage.setItem(k,o[k]);});alert('✓');location.reload();}catch(x){alert('✗');}};
    r.readAsText(f);};
}

/* ---- review ETA + renewal banner ---- */
function status(){
  var s=document.querySelector('.vip-status');if(!s||s.dataset.lx)return;s.dataset.lx='1';
  if(s.classList.contains('pending')){var p=document.createElement('p');p.textContent='⏱️ '+T('نراجع الطلبات عادةً خلال ','We usually review requests within ','Nous examinons les demandes sous ')+(cfg.eta||T('24 ساعة','24 hours','24 h'))+'.';s.appendChild(p);}
  if(s.querySelector('.vip-days.warn')){var b=document.createElement('div');b.className='vip-card lx-ban';
    b.innerHTML='<b>🔄 '+T('اشتراكك على وشك الانتهاء','Your plan ends soon','Ton abonnement se termine bientôt')+'</b><p style="font-size:.85rem;margin:6px 0">'+T('للتجديد حوّل ','To renew, send ','Pour renouveler, envoie ')+esc(cfg.price||'')+T(' إلى CCP ثم أرسل طلباً جديداً بعد انتهاء المدة.',' to CCP, then submit a new request after expiry.',' au CCP puis fais une nouvelle demande après expiration.')+'</p><code style="direction:ltr;display:block;color:#ffd700;margin:6px 0">'+esc(cfg.ccp||'')+'</code><button type="button" class="btn small vip-btn" style="width:auto">'+T('نسخ الرقم','Copy number','Copier')+'</button>';
    b.querySelector('button').onclick=function(){try{navigator.clipboard.writeText(cfg.ccp||'');}catch(x){console.warn(x)}this.textContent='✓';};
    s.after(b);}
}

/* ---- Web Push (set APP_CONFIG.vapid = public VAPID key; backend-additions.js + sw-push.js required) ---- */
function u8(b){var p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;}
function subscribe(){
  if(!cfg.vapid||!E()||!window.Notification||Notification.permission!=='granted'||!navigator.serviceWorker||localStorage.getItem('lx-push:'+E()))return;
  navigator.serviceWorker.ready.then(function(g){if(!g.pushManager)return;
    return g.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(cfg.vapid)}).then(function(sub){
      return api('/api/push/subscribe','POST',{email:E(),sub:sub}).then(function(r){if(r.ok)localStorage.setItem('lx-push:'+E(),'1');});});}).catch(function(){});
}
function push(){
  var ck=document.getElementById('ckW');
  if(!ck||!window.Notification||Notification.permission!=='default'||document.getElementById('lxPn'))return;
  var d=document.createElement('div');d.id='lxPn';d.className='vip-card lx-ban';
  d.innerHTML='<b>🔔 '+T('لا تفوّتك ردود المدرب','Never miss a coach reply','Ne rate aucune réponse du coach')+'</b><p style="font-size:.85rem;margin:6px 0">'+T('فعّل الإشعارات لتصلك تنبيهات القبول والبرنامج والردود.','Enable notifications for approval, program and reply alerts.','Active les notifications pour l’acceptation, le programme et les réponses.')+'</p><button type="button" class="btn small vip-btn" style="width:auto">'+T('تفعيل','Enable','Activer')+'</button>';
  d.querySelector('button').onclick=function(){Notification.requestPermission().then(function(){d.remove();subscribe();});};
  ck.closest('.vip-card').before(d);
}
function run(){try{program();checkin();backup();status();push();subscribe();restore();}catch(x){console.debug('lx run:',x)}}
var q=0;new MutationObserver(function(){if(q)return;q=setTimeout(function(){q=0;run();},200);}).observe(document.body,{childList:true,subtree:true});
})();
</script>
