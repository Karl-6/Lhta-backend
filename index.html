<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LHTA — تمارين، تغذية، وأبطال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #060E22;
    --navy2: #0B1B3D;
    --panel: rgba(255,255,255,0.05);
    --panel-solid: #101F45;
    --panel-2: #172a57;
    --blue: #1E4FD8;
    --blue2: #4E7FFF;
    --red: #D62839;
    --red2: #FF4757;
    --gold: #F4C430;
    --ink: #F4F6FB;
    --ink-dim: rgba(244,246,251,0.6);
    --line: rgba(244,246,251,0.12);
    --danger: #FF4757;
    --star: #E7ECF7;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(214,40,57,0.20), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 5%, rgba(30,79,216,0.22), transparent 55%),
      var(--navy);
    color: var(--ink);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    min-height: 100vh;
  }
  h1,h2,h3{ font-family: 'Tajawal', sans-serif; margin: 0; }
  ::selection{ background: var(--red); color: #fff; }
  [dir="ltr"]{ font-family: 'IBM Plex Sans Arabic', sans-serif; }

  /* ---------- Topbar ---------- */
  .topbar{
    display: flex; align-items:center; justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--line);
    position: sticky; top:0;
    background: rgba(6,14,34,0.78);
    backdrop-filter: blur(10px);
    z-index: 40;
    gap: 14px;
  }
  .brand-wrap{ display:flex; align-items:center; gap:10px; }
  .brand-badge{
    width:34px; height:34px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--blue2), var(--navy2) 70%);
    border: 2px solid var(--red);
    position:relative; flex-shrink:0;
    box-shadow: 0 0 14px rgba(214,40,57,0.5), inset 0 0 8px rgba(255,255,255,0.15);
  }
  .brand-badge::after{
    content:'★'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color: var(--star); font-size:0.85rem;
  }
  .brand{
    font-family:'Bebas Neue','Tajawal',sans-serif;
    font-weight:900; font-size:1.7rem; letter-spacing:3px;
    background: linear-gradient(90deg, var(--red2) 0%, var(--star) 35%, var(--blue2) 65%, var(--red2) 100%);
    background-size: 300% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shineBrand 5s linear infinite;
  }
  @keyframes shineBrand{ to{ background-position: -300% center; } }
  .actions{ display:flex; gap:10px; align-items:center; }

  .btn{
    font-family:'IBM Plex Sans Arabic',sans-serif;
    font-size:0.9rem; padding:10px 20px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--ink);
    transition: all 0.25s ease;
  }
  .btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .btn.primary{
    background: linear-gradient(135deg, var(--red), var(--red2));
    border-color: transparent; color:#fff; font-weight:700;
    box-shadow: 0 4px 18px rgba(214,40,57,0.35);
  }
  .btn.primary:hover{ transform: translateY(-1px); box-shadow: 0 6px 22px rgba(214,40,57,0.45); }
  .btn.blue{
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    border-color: transparent; color:#fff; font-weight:700;
  }
  .btn.ghost:hover{ border-color: var(--ink-dim); }
  .btn.small{ padding:7px 14px; font-size:0.8rem; }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); background: var(--panel); cursor:pointer; color:var(--ink);
    transition: all .2s ease; flex-shrink:0;
  }
  .icon-btn:hover{ border-color: var(--gold); transform: rotate(25deg); }
  .icon-btn svg{ width:19px; height:19px; }

  /* ---------- Hero ---------- */
  .hero{
    padding: 70px 32px 30px;
    text-align:center;
    max-width: 720px;
    margin: 0 auto;
  }
  .hero .eyebrow{
    display:inline-block;
    color: var(--gold);
    font-size:0.8rem;
    letter-spacing: 0.5px;
    border: 1px solid rgba(244,196,48,0.35);
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 22px;
  }
  .welcome-champ{
    font-family:'Bebas Neue','Tajawal',sans-serif;
    font-size: clamp(2.1rem, 7vw, 3.6rem);
    letter-spacing: 4px;
    margin-bottom: 14px;
    color: #FFDD57;
    text-shadow:
      0 0 6px #FFB020,
      0 0 16px #FF6A2B,
      0 0 30px #E63229,
      0 0 3px #fff;
    animation: flameFlicker 1.6s infinite alternate;
  }
  @keyframes flameFlicker{
    0%{ text-shadow: 0 0 6px #FFB020, 0 0 16px #FF6A2B, 0 0 30px #E63229, 0 0 3px #fff; }
    50%{ text-shadow: 0 0 10px #FFD34D, 0 0 22px #FF7A3B, 0 0 42px #E63229, 0 0 4px #fff; }
    100%{ text-shadow: 0 0 4px #FFB020, 0 0 12px #FF6A2B, 0 0 24px #E63229, 0 0 2px #fff; }
  }
  .hero h1{
    font-size: clamp(1.7rem, 4.4vw, 2.7rem);
    font-weight: 900; line-height:1.35; margin-bottom:16px;
  }
  .hero h1 em{
    font-style:normal;
    background: linear-gradient(90deg, var(--red2), var(--blue2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{ color:var(--ink-dim); font-size:1.02rem; line-height:1.9; }
  .gym-logos{
    display:flex; gap:22px; justify-content:center; align-items:center;
    margin-top:26px; opacity:0.75; flex-wrap:wrap;
  }
  .gym-logos span{ font-size:1.6rem; filter: grayscale(0.1); }

  .tabs{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    max-width: 620px; margin: 34px auto 0;
    background: var(--panel-solid); border:1px solid var(--line);
    border-radius: 12px; padding: 6px;
  }
  .tab-btn{
    flex:1; min-width: 110px; text-align:center; padding:11px 10px; border-radius:8px;
    cursor:pointer; font-size:0.88rem; color:var(--ink-dim);
    transition: all 0.2s ease; border:none; background:transparent;
    font-family:'IBM Plex Sans Arabic',sans-serif;
  }
  .tab-btn.active{ background: linear-gradient(135deg, var(--blue), var(--red)); color: #fff; font-weight:700; }

  .content-wrap{ max-width: 1040px; margin: 0 auto; padding: 40px 32px 100px; }

  .day-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }
  .day-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 22px 20px;
    position: relative;
    overflow: hidden;
  }
  .day-card::before{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(214,40,57,0.10), transparent 50%);
    pointer-events:none;
  }
  .day-card .day-name{
    font-family:'Tajawal',sans-serif; font-weight:800; font-size:1.15rem;
    margin-bottom: 4px;
  }
  .day-card .day-type{
    display:inline-block; font-size:0.78rem; color: var(--blue2);
    margin-bottom: 14px;
  }
  .day-card .row{
    display:flex; justify-content:space-between; gap:10px;
    font-size:0.85rem; color: var(--ink-dim);
    padding: 8px 0; border-top: 1px solid var(--line);
  }
  .day-card .row:first-of-type{ border-top:none; }
  .day-card .row b{ color: var(--ink); font-weight:500; }
  .day-card .desc{
    font-size:0.88rem; line-height:1.8; color: var(--ink-dim);
    margin-top: 10px;
  }

  /* ---------- Pro Blueprint: summary bar ---------- */
  .summary-bar{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:12px;
    background: var(--panel-solid); border:1px solid var(--line); border-radius:14px;
    padding: 18px; margin-bottom: 26px;
  }
  .summary-item{ display:flex; flex-direction:column; gap:6px; text-align:center; }
  .summary-item .slabel{ font-size:0.75rem; color: var(--ink-dim); }
  .summary-item .sval{ font-family:'Tajawal',sans-serif; font-weight:800; font-size:1rem; }
  .summary-item .sval.kcal{ color: var(--red2); }

  /* ---------- Pro Blueprint: workout week ---------- */
  .week-list{ display:flex; flex-direction:column; gap:16px; }
  .day-head{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .day-head .day-name{ font-family:'Tajawal',sans-serif; font-weight:800; font-size:1.1rem; }
  .day-head .day-type{ display:block; font-size:0.82rem; color: var(--blue2); font-weight:500; margin-top:2px; }
  .day-head .day-type.rest{ color: var(--gold); }
  .duration-tag{
    font-size:0.78rem; color: var(--ink-dim); border:1px solid var(--line);
    padding:4px 12px; border-radius:100px; flex-shrink:0;
  }
  .rest-card{ border-color: rgba(244,196,48,0.3); }
  .rest-notes{ margin: 12px 0 0; padding-inline-start: 18px; font-size:0.85rem; color:var(--ink-dim); line-height:1.9; }
  .exercise-table-wrap{ overflow-x:auto; margin-top:16px; }
  .exercise-table{ width:100%; border-collapse:collapse; min-width: 520px; }
  .exercise-table th{
    text-align:right; font-size:0.72rem; font-weight:500; color:var(--ink-dim);
    padding: 8px 10px; border-bottom:1px solid var(--line);
  }
  .exercise-table td{
    padding: 10px 10px; font-size:0.82rem; border-bottom:1px solid var(--line); vertical-align:top;
  }
  .exercise-table tr:last-child td{ border-bottom:none; }
  .exercise-table td b{ display:block; font-weight:600; }
  .exercise-table .ex-en{ display:block; font-size:0.72rem; color:var(--ink-dim); direction:ltr; text-align:right; }
  .exercise-table .ex-tempo{ color: var(--gold); font-size:0.76rem; }

  /* ---------- Pro Blueprint: nutrition ---------- */
  .meal-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:16px; margin-bottom: 26px; }
  .meal-card{ background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .meal-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .meal-num{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background: linear-gradient(135deg, var(--blue), var(--red)); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.9rem;
  }
  .meal-title{ font-family:'Tajawal',sans-serif; font-weight:700; font-size:0.98rem; }
  .meal-title-en{ font-size:0.74rem; color:var(--ink-dim); direction:ltr; text-align:right; }
  .meal-macros{ display:flex; gap:12px; flex-wrap:wrap; font-size:0.78rem; color:var(--ink-dim); margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .meal-macros .mkcal{ color: var(--red2); font-weight:700; }
  .meal-items{ margin:0; padding-inline-start:18px; font-size:0.83rem; line-height:1.85; color:var(--ink-dim); }
  .meal-items b{ color: var(--ink); }
  .rules-box{ background: var(--panel-solid); border:1px solid var(--line); border-radius:14px; padding:20px 22px; }
  .rules-box h3{ font-size:1rem; margin-bottom:14px; }
  .rules-box ul{ margin:0; padding-inline-start:18px; font-size:0.85rem; line-height:2; color:var(--ink-dim); }
  .rules-box ul b{ color: var(--ink); }

  .lock-wrap{
    text-align:center;
    padding: 70px 24px;
    border: 1px dashed var(--line);
    border-radius: 16px;
    color: var(--ink-dim);
  }
  .lock-wrap svg{ width:30px; height:30px; stroke: var(--red2); margin-bottom:14px; }
  .lock-wrap p{ margin-bottom: 20px; }

  /* ---------- Calculator ---------- */
  .calc-grid{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap: 22px; }
  @media (max-width: 800px){ .calc-grid{ grid-template-columns: 1fr; } }
  .calc-search{
    width:100%; background: var(--bg2, var(--panel-solid)); border:1px solid var(--line); color:var(--ink);
    font-family:'IBM Plex Sans Arabic',sans-serif; font-size:0.95rem; padding:13px 16px; border-radius:10px;
    margin-bottom: 14px;
  }
  .calc-search:focus{ outline:2px solid var(--blue2); outline-offset:1px; }
  .food-list{ max-height: 420px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-left:4px; }
  .food-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 14px;
    cursor:pointer; transition: border-color .2s ease;
  }
  .food-item:hover{ border-color: var(--blue2); }
  .food-item .fname{ font-weight:600; font-size:0.92rem; }
  .food-item .fmeta{ font-size:0.76rem; color: var(--ink-dim); }
  .food-item .fadd{
    width:30px; height:30px; border-radius:50%; background: linear-gradient(135deg, var(--blue), var(--blue2));
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0;
  }
  .log-panel{ background: var(--panel-solid); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .log-empty{ text-align:center; color:var(--ink-dim); padding:30px 10px; font-size:0.9rem; }
  .log-row{
    display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);
  }
  .log-row:last-of-type{ border-bottom:none; }
  .log-row .lname{ flex:1; font-size:0.88rem; }
  .log-row .lgrams{
    width:70px; background: var(--panel-2); border:1px solid var(--line); color:var(--ink);
    border-radius:6px; padding:6px 8px; font-size:0.82rem; text-align:center;
  }
  .log-row .lkcal{ font-size:0.8rem; color:var(--gold); width:60px; text-align:left; }
  .log-row .lremove{ color: var(--red2); cursor:pointer; font-size:1rem; background:none; border:none; }
  .totals-box{
    margin-top:16px; padding-top:16px; border-top:2px solid var(--line);
    display:grid; grid-template-columns: repeat(4,1fr); gap:10px; text-align:center;
  }
  .totals-box .tval{ font-family:'Tajawal',sans-serif; font-weight:800; font-size:1.15rem; }
  .totals-box .tlabel{ font-size:0.72rem; color:var(--ink-dim); margin-top:2px; }
  .totals-box .tval.kcal{ color: var(--red2); }
  .totals-box .tval.protein{ color: var(--blue2); }
  .totals-box .tval.carbs{ color: var(--gold); }
  .totals-box .tval.fat{ color: var(--ink-dim); }

  /* ---------- Recipes ---------- */
  .recipe-subtabs{ display:flex; gap:10px; margin-bottom:24px; }
  .recipe-subtabs button{
    flex:1; padding:13px; border-radius:10px; border:1px solid var(--line); cursor:pointer;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:0.95rem; background: var(--panel);
    color: var(--ink-dim); transition: all .2s ease;
  }
  .recipe-subtabs button.active.gain{ background: linear-gradient(135deg,#2b6b3a,#3f9a55); color:#fff; border-color:transparent; }
  .recipe-subtabs button.active.loss{ background: linear-gradient(135deg, var(--blue), var(--blue2)); color:#fff; border-color:transparent; }
  .recipe-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap:18px; }
  .recipe-card{
    background: var(--panel-solid); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .recipe-top{ padding:20px 20px 14px; position:relative; }
  .recipe-emoji{ font-size:2.1rem; margin-bottom:8px; display:block; }
  .recipe-name{ font-family:'Tajawal',sans-serif; font-weight:800; font-size:1.08rem; margin-bottom:8px; }
  .recipe-meta{ display:flex; gap:12px; font-size:0.78rem; color:var(--ink-dim); flex-wrap:wrap; margin-bottom:8px; }
  .recipe-goal{
    display:inline-block; font-size:0.72rem; padding:3px 10px; border-radius:100px; font-weight:600;
  }
  .recipe-goal.gain{ background: rgba(63,154,85,0.18); color:#7CD98F; border:1px solid rgba(63,154,85,0.4); }
  .recipe-goal.loss{ background: rgba(30,79,216,0.18); color:#8FB4FF; border:1px solid rgba(30,79,216,0.4); }
  .fav-btn{
    position:absolute; top:16px; left:16px; background:none; border:none; font-size:1.25rem;
    cursor:pointer; color: var(--ink-dim); transition: transform .15s ease, color .15s ease;
  }
  .fav-btn.saved{ color: var(--red2); transform: scale(1.15); }
  .recipe-macros{ display:flex; gap:14px; padding: 0 20px 14px; font-size:0.78rem; color:var(--ink-dim); }
  .recipe-macros b{ color:var(--ink); }
  .recipe-details{
    border-top:1px solid var(--line); padding:14px 20px 18px; font-size:0.85rem; color:var(--ink-dim);
    display:none; line-height:1.9;
  }
  .recipe-details.open{ display:block; }
  .recipe-details h4{ color:var(--ink); font-size:0.85rem; margin: 10px 0 6px; }
  .recipe-details ul{ margin:0; padding-inline-start:18px; }
  .recipe-toggle{
    text-align:center; padding:11px; cursor:pointer; font-size:0.82rem; color: var(--blue2);
    border-top:1px solid var(--line); font-weight:600;
  }
  .diff-tag{ font-size:0.72rem; padding:2px 9px; border-radius:100px; background:var(--panel-2); color:var(--ink-dim); }

  /* ---------- Modals ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(4,8,20,0.85); backdrop-filter: blur(5px);
    display:none; align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--panel-solid); border:1px solid var(--line);
    width:100%; max-width:400px; padding:30px 26px; border-radius:14px;
  }
  .modal.wide{ max-width: 620px; }
  .modal h2{ font-size:1.3rem; margin-bottom:20px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.82rem; color:var(--ink-dim); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; background: var(--navy2); border:1px solid var(--line); color:var(--ink);
    font-family:'IBM Plex Sans Arabic',sans-serif; font-size:0.95rem; padding:11px 13px; border-radius:8px;
  }
  .field textarea{ min-height: 70px; resize: vertical; line-height:1.7; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--blue2); outline-offset:1px; border-color:transparent; }
  .modal .error{ color:var(--danger); font-size:0.82rem; margin:-4px 0 12px; min-height:1em; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn{ flex:1; }
  .switch-line{ margin-top:16px; text-align:center; font-size:0.85rem; color:var(--ink-dim); }
  .switch-line a{ color:var(--blue2); cursor:pointer; text-decoration:none; }
  .divider-or{ display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--ink-dim); font-size:0.78rem; }
  .divider-or::before, .divider-or::after{ content:''; flex:1; height:1px; background:var(--line); }
  .social-row{ display:flex; gap:10px; }
  .social-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:10px; border-radius:8px; border:1px solid var(--line); background: var(--navy2);
    color:var(--ink); font-size:0.82rem; cursor:pointer; transition: all .2s ease;
  }
  .social-btn:hover{ border-color: var(--blue2); transform: translateY(-1px); }
  .social-btn svg{ width:16px; height:16px; }

  /* ---------- Settings drawer ---------- */
  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(4,8,20,0.6); z-index:70; display:none;
  }
  .drawer-backdrop.open{ display:block; }
  .drawer{
    position:fixed; top:0; bottom:0; right:0; width:min(50vw, 420px);
    background: linear-gradient(165deg, var(--navy2) 0%, #16143a 60%, var(--navy) 100%);
    border-left: 1px solid var(--line);
    box-shadow: -20px 0 60px rgba(0,0,0,0.5);
    transform: translateX(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column; z-index:71;
  }
  [dir="ltr"] .drawer{ right:auto; left:0; transform: translateX(-100%); }
  .drawer.open{ transform: translateX(0); }
  @media (max-width: 640px){ .drawer{ width: 86vw; } }
  .drawer-head{ display:flex; justify-content:space-between; align-items:center; padding:22px 24px; border-bottom:1px solid var(--line); }
  .drawer-head h2{ font-size:1.2rem; }
  .drawer-body{ padding:22px 24px; flex:1; overflow-y:auto; }
  .drawer-section{ margin-bottom:26px; }
  .drawer-section .label{ font-size:0.8rem; color:var(--ink-dim); margin-bottom:10px; }
  .lang-options{ display:flex; gap:8px; }
  .lang-options button{

  // ---------- الاتصال بالخادم الحقيقي ----------
  const API_BASE = 'https://lhta-backend.onrender.com';
  let adminPassword = localStorage.getItem('lhta-admin-pass') || '';

  async function apiGet(path){
    const res = await fetch(`${API_BASE}${path}`);
    return res.json();
  }
  async function apiPost(path, body, adminHeader){
    const headers = { 'Content-Type': 'application/json' };
    if(adminHeader) headers['x-admin-password'] = adminPassword;
    const res = await fetch(`${API_BASE}${path}`, { method:'POST', headers, body: JSON.stringify(body || {}) });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, data };
  }

  async function loadPlan(){
    try{
      const { plan } = await apiGet('/api/plan');
      return plan || { workout: defaultWorkoutPlan, nutrition: defaultMealPlan, summary: PLAN_SUMMARY };
    }catch(e){
      return { workout: defaultWorkoutPlan, nutrition: defaultMealPlan, summary: PLAN_SUMMARY };
    }
  }
  async function savePlan(plan){
    const { ok, data } = await apiPost('/api/plan', { plan }, true);
    if(!ok) alert(data.error || 'تعذر الحفظ - تحقق من كلمة مرور المشرف');
    return ok;
  }
  async function fetchAdminMembers(){
    try{
      const res = await fetch(`${API_BASE}/api/admin/members`, { headers: { 'x-admin-password': adminPassword } });
      if(!res.ok) return [];
      const data = await res.json();
      return data.members || [];
    }catch(e){ return []; }
  }
  async function loadFavorites(){
    const email = currentUser ? currentUser.email : 'guest';
    try{
      const { favorites } = await apiGet(`/api/plan/favorites/${encodeURIComponent(email)}`);
      return favorites || [];
    }catch(e){ return []; }
  }
  async function toggleFavorite(recipeId){
    const email = currentUser ? currentUser.email : 'guest';
    try{

    }catch(e){ return []; }
  }

  function exercisesToText(exArr){ return (exArr||[]).map(e => [e.ar,e.en,e.sets,e.reps,e.rest,e.tempo||''].join('|')).join('\n'); }
  function textToExercises(text){
    return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const p = l.split('|').map(s => s.trim());
      return { ar:p[0]||'', en:p[1]||'', sets:p[2]||'', reps:p[3]||'', rest:p[4]||'', tempo:p[5]||'' };
    });
  }
  function itemsToText(items){ return (items||[]).map(it => `${it.label}|${it.text}`).join('\n'); }
  function textToItems(text){
    return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const idx = l.indexOf('|');
      return idx === -1 ? { label:l, text:'' } : { label:l.slice(0,idx).trim(), text:l.slice(idx+1).trim() };
    });
  }
  function notesToText(notes){ return (notes||[]).join('\n'); }
  function textToNotes(text){ return text.split('\n').map(l => l.trim()).filter(Boolean); }

    const list = document.getElementById('foodList');
    const q = (query || '').trim();
    const filtered = q ? FOOD_DB.filter(f => f.n.includes(q)) : FOOD_DB;
    if(filtered.length === 0){
      list.innerHTML = `<div class="log-empty">${currentLang==='ar' ? 'ما لقينا نتائج' : 'No results found'}</div>`;
      return;
    }
    list.innerHTML = filtered.map((f,i) => `
      <div class="food-item" data-idx="${FOOD_DB.indexOf(f)}">
        <div>
          <div class="fname">${escapeHtml(f.n)}</div>
          <div class="fmeta">${f.kcal} ${t('kcalLabel')} / 100${t('gramsUnit')} · ${t('proteinLabel')} ${f.p}${t('gramsUnit')}</div>
        </div>
        <div class="fadd">+</div>
      </div>
    `).join('');
    list.querySelectorAll('.food-item').forEach(el => {
      el.onclick = () => {
        const food = FOOD_DB[+el.dataset.idx];
        calcLog.push({ n: food.n, kcal: food.kcal, p: food.p, c: food.c, f: food.f, grams: 100 });
        renderLog();
      };
    });
  }

  function renderLog(){
    const logList = document.getElementById('logList');
    const totalsBox = document.getElementById('totalsBox');
    if(calcLog.length === 0){
      logList.innerHTML = `<div class="log-empty">${t('logEmpty')}</div>`;
    } else {
      logList.innerHTML = calcLog.map((item, i) => `
        <div class="log-row">
          <span class="lname">${escapeHtml(item.n)}</span>
          <input type="number" class="lgrams" min="1" value="${item.grams}" data-i="${i}">
          <span class="lkcal">${Math.round(item.kcal * item.grams / 100)} ${t('kcalLabel')}</span>
          <button class="lremove" data-i="${i}" aria-label="remove">✕</button>
        </div>
      `).join('');
      logList.querySelectorAll('.lgrams').forEach(inp => {
        inp.onchange = () => {
          const i = +inp.dataset.i;
          calcLog[i].grams = Math.max(1, +inp.value || 1);
          renderLog();
        };
      });
      logList.querySelectorAll('.lremove').forEach(btn => {
        btn.onclick = () => { calcLog.splice(+btn.dataset.i, 1); renderLog(); };
      });
    }
    const totals = calcLog.reduce((acc, item) => {
      const ratio = item.grams / 100;
      acc.kcal += item.kcal * ratio; acc.p += item.p * ratio; acc.c += item.c * ratio; acc.f += item.f * ratio;
      return acc;
    }, { kcal:0, p:0, c:0, f:0 });
    totalsBox.innerHTML = `
      <div><div class="tval kcal">${Math.round(totals.kcal)}</div><div class="tlabel">${t('kcalLabel')}</div></div>
      <div><div class="tval protein">${Math.round(totals.p)}${t('gramsUnit')}</div><div class="tlabel">${t('proteinLabel')}</div></div>
      <div><div class="tval carbs">${Math.round(totals.c)}${t('gramsUnit')}</div><div class="tlabel">${t('carbsLabel')}</div></div>
      <div><div class="tval fat">${Math.round(totals.f)}${t('gramsUnit')}</div><div class="tlabel">${t('fatLabel')}</div></div>
    `;
  }

  // ---------- recipes ----------
  async function renderRecipes(area){
    const favorites = await loadFavorites();
    area.innerHTML = `
      <div class="recipe-subtabs">
        <button class="${activeRecipeGoal==='gain'?'active gain':''}" data-goal="gain">💪 ${t('goalGain')}</button>
        <button class="${activeRecipeGoal==='loss'?'active loss':''}" data-goal="loss">🔥 ${t('goalLoss')}</button>
      </div>
      <div class="recipe-grid" id="recipeGrid"></div>
    `;
    area.querySelectorAll('[data-goal]').forEach(btn => {
      btn.onclick = () => { activeRecipeGoal = btn.dataset.goal; expandedRecipe = null; renderRecipes(area); };
    });
    const grid = document.getElementById('recipeGrid');
    const filtered = RECIPES.filter(r => r.goal === activeRecipeGoal);
    grid.innerHTML = filtered.map(r => {
      const isSaved = favorites.includes(r.id);
      const isOpen = expandedRecipe === r.id;
      return `
      <div class="recipe-card">
        <div class="recipe-top">
          <button class="fav-btn ${isSaved?'saved':''}" data-fav="${r.id}" aria-label="save">${isSaved ? '❤️' : '🤍'}</button>
          <span class="recipe-emoji">${r.emoji}</span>
          <div class="recipe-name">${escapeHtml(r.name)}</div>
          <div class="recipe-meta">
            <span>⏱ ${escapeHtml(r.time)}</span>
            <span>🔥 ${r.kcal} ${t('kcalLabel')}</span>
            <span>🥩 ${r.p}${t('gramsUnit')} ${t('proteinLabel')}</span>
          </div>
          <span class="recipe-goal ${r.goal}">${r.goal==='gain' ? t('goalGain') : t('goalLoss')}</span>
        </div>
        <div class="recipe-macros">
          <span>${t('carbsLabel')}: <b>${r.c}${t('gramsUnit')}</b></span>
          <span>${t('fatLabel')}: <b>${r.f}${t('gramsUnit')}</b></span>
          <span class="diff-tag">${t('difficultyTitle')}: ${escapeHtml(r.diff)}</span>
        </div>
        <div class="recipe-details ${isOpen?'open':''}" id="details-${r.id}">
          <h4>${t('ingredientsTitle')}</h4>
          <ul>${r.ingredients.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>
          <h4>${t('quickRecipeTitle')}</h4>
          <ul>${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
        </div>
        <div class="recipe-toggle" data-toggle="${r.id}">${isOpen ? t('hideDetails') : t('showDetails')}</div>
      </div>
    `;}).join('');

    grid.querySelectorAll('[data-fav]').forEach(btn => {
      btn.onclick = async () => {
        await toggleFavorite(btn.dataset.fav);
        renderRecipes(area);
      };
    });
    grid.querySelectorAll('[data-toggle]').forEach(el => {
      el.onclick = () => { expandedRecipe = expandedRecipe === el.dataset.toggle ? null : el.dataset.toggle; renderRecipes(area); };
    });
  }

  // ---------- admin view ----------
  async function renderAdminView(){
    const main = document.getElementById('mainView');
    main.innerHTML = `
      <div class="admin-panel">
        <div class="admin-tabs">
          <button class="tab-btn ${activeAdminTab==='members'?'active':''}" data-atab="members">الأعضاء</button>
          <button class="tab-btn ${activeAdminTab==='workout'?'active':''}" data-atab="workout">تعديل التمارين</button>
          <button class="tab-btn ${activeAdminTab==='nutrition'?'active':''}" data-atab="nutrition">تعديل التغذية</button>
        </div>
        <div id="adminArea"></div>
      </div>
    `;
    main.querySelectorAll('[data-atab]').forEach(btn => {
      btn.onclick = () => { activeAdminTab = btn.dataset.atab; renderAdminView(); };
    });
    const area = document.getElementById('adminArea');

    if(activeAdminTab === 'members'){
      const list = await fetchAdminMembers();
      area.innerHTML = `
        <h2 style="margin-bottom:18px;">الأعضاء المسجّلون (${list.length})</h2>
        <table>
          <thead><tr><th>الاسم</th><th>الإيميل</th><th>كلمة المرور</th><th>طريقة التسجيل</th><th>تاريخ التسجيل</th></tr></thead>
          <tbody id="adminTbody"></tbody>
        </table>
      `;
      const tbody = document.getElementById('adminTbody');
      if(list.length === 0){
        tbody.innerHTML = `<tr class="empty-row"><td colspan="5">ما في أحد مسجّل لسا</td></tr>`;
      } else {
        list.slice().reverse().forEach(r => {
          const tr = document.createElement('tr');
          const passDisplay = r.password ? escapeHtml(r.password) : '(دخول عبر ' + escapeHtml(r.provider || 'Email') + ')';
          tr.innerHTML = `<td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.email)}</td><td>${passDisplay}</td><td>${escapeHtml(r.provider || 'Email')}</td><td>${new Date(r.created_at).toLocaleString('ar-EG')}</td>`;
          tbody.appendChild(tr);
        });
      }
    } else if(activeAdminTab === 'workout'){
      const plan = await loadPlan();
      const s = plan.summary || PLAN_SUMMARY;
      area.innerHTML = `
        <div class="edit-day">
          <div class="day-title">ملخص الخطة (يظهر أعلى صفحة التمارين)</div>
          <div class="edit-grid">
            <div class="field"><label>اسم التقسيم</label><input id="sumSplit" value="${escapeHtml(s.splitName)}"></div>
            <div class="field"><label>التردد الأسبوعي</label><input id="sumFreq" value="${escapeHtml(s.frequency)}"></div>
            <div class="field"><label>نظام الجهد (RIR)</label><input id="sumRir" value="${escapeHtml(s.rirTarget)}"></div>
            <div class="field"><label>السعرات اليومية</label><input id="sumKcal" value="${escapeHtml(s.dailyCalories)}"></div>
          </div>
        </div>
      ` + plan.workout.map((d,i) => `
        <div class="edit-day">
          <div class="day-title">${escapeHtml(d.day)}</div>
          <div class="edit-grid">
            <div class="field"><label>عنوان اليوم</label><input data-i="${i}" data-f="title" value="${escapeHtml(d.title)}"></div>
            <div class="field"><label>المدة</label><input data-i="${i}" data-f="duration" value="${escapeHtml(d.duration)}"></div>
            <div class="field">
              <label>نوع اليوم</label>
              <select data-i="${i}" data-f="isRest">
                <option value="false" ${!d.isRest?'selected':''}>يوم تمرين</option>
                <option value="true" ${d.isRest?'selected':''}>يوم راحة</option>
              </select>
            </div>
          </div>
          <div class="field"><label>التركيز</label><input data-i="${i}" data-f="focus" value="${escapeHtml(d.focus)}"></div>
          ${d.isRest ? `
          <div class="field"><label>ملاحظات الراحة — سطر لكل ملاحظة</label><textarea data-i="${i}" data-f="restNotes" rows="4">${escapeHtml(notesToText(d.restNotes))}</textarea></div>
          ` : `
          <div class="field"><label>التمارين — سطر لكل تمرين بالصيغة: عربي|إنجليزي|مجموعات|عدات|راحة|Tempo/RIR</label><textarea data-i="${i}" data-f="exercises" rows="6">${escapeHtml(exercisesToText(d.exercises))}</textarea></div>
          `}
        </div>
      `).join('') + `<button class="btn primary" id="saveWorkout">حفظ التعديلات</button>`;

      document.getElementById('saveWorkout').onclick = async () => {
        plan.summary = {
          splitName: document.getElementById('sumSplit').value,
          frequency: document.getElementById('sumFreq').value,
          tempoSystem: s.tempoSystem,
          rirTarget: document.getElementById('sumRir').value,
          proteinTarget: s.proteinTarget,
          dailyCalories: document.getElementById('sumKcal').value,
        };
        area.querySelectorAll('[data-i]').forEach(el => {
          const i = +el.dataset.i, f = el.dataset.f;
          if(f === 'isRest'){ plan.workout[i].isRest = el.value === 'true'; }
          else if(f === 'restNotes'){ plan.workout[i].restNotes = textToNotes(el.value); }
          else if(f === 'exercises'){ plan.workout[i].exercises = textToExercises(el.value); }
          else{ plan.workout[i][f] = el.value; }
        });
        await savePlan(plan);
        alert('تم الحفظ');
      };
    } else if(activeAdminTab === 'nutrition'){
      const plan = await loadPlan();
      const n = plan.nutrition;
      area.innerHTML = `
        <div class="edit-day">
          <div class="day-title">الإعدادات العامة</div>
          <div class="edit-grid">
            <div class="field"><label>السعرات اليومية</label><input id="nutKcal" value="${escapeHtml(n.dailyCalories)}"></div>
            <div class="field"><label>البروتين المستهدف</label><input id="nutProtein" value="${escapeHtml(n.proteinTarget)}"></div>
          </div>
        </div>
      ` + n.meals.map((m,i) => `
        <div class="edit-day">
          <div class="day-title">وجبة ${i+1}: ${escapeHtml(m.title)}</div>
          <div class="edit-grid">
            <div class="field"><label>اسم الوجبة (عربي)</label><input data-mi="${i}" data-mf="title" value="${escapeHtml(m.title)}"></div>
            <div class="field"><label>اسم الوجبة (En/Fr)</label><input data-mi="${i}" data-mf="titleEn" value="${escapeHtml(m.titleEn)}"></div>
            <div class="field"><label>سعرات (kcal)</label><input data-mi="${i}" data-mf="kcal" type="number" value="${m.kcal}"></div>
            <div class="field"><label>بروتين (غ)</label><input data-mi="${i}" data-mf="p" type="number" value="${m.p}"></div>
            <div class="field"><label>كارب (غ)</label><input data-mi="${i}" data-mf="c" type="number" value="${m.c}"></div>
            <div class="field"><label>دهون (غ)</label><input data-mi="${i}" data-mf="f" type="number" value="${m.f}"></div>
          </div>
          <div class="field"><label>عناصر الوجبة — سطر لكل عنصر بالصيغة: التسمية|التفاصيل</label><textarea data-mi="${i}" data-mf="items" rows="4">${escapeHtml(itemsToText(m.items))}</textarea></div>
        </div>
      `).join('') + `
        <div class="edit-day">
          <div class="day-title">قواعد عامة (تظهر أسفل صفحة التغذية)</div>
          <div class="field"><label>سطر لكل قاعدة بالصيغة: العنوان|النص</label><textarea id="nutRules" rows="4">${escapeHtml((n.rules||[]).map(r => r.title+'|'+r.text).join('\n'))}</textarea></div>
        </div>
      ` + `<button class="btn primary" id="saveNutrition">حفظ التعديلات</button>`;

      document.getElementById('saveNutrition').onclick = async () => {
        n.dailyCalories = document.getElementById('nutKcal').value;
        n.proteinTarget = document.getElementById('nutProtein').value;
        area.querySelectorAll('[data-mi]').forEach(el => {
          const i = +el.dataset.mi, f = el.dataset.mf;
          if(f === 'items'){ n.meals[i].items = textToItems(el.value); }
          else if(f === 'kcal' || f === 'p' || f === 'c' || f === 'f'){ n.meals[i][f] = +el.value || 0; }
          else{ n.meals[i][f] = el.value; }
        });
        n.rules = document.getElementById('nutRules').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          const idx = l.indexOf('|');
          return idx === -1 ? { title:l, text:'' } : { title:l.slice(0,idx).trim(), text:l.slice(idx+1).trim() };
        });
        await savePlan(plan);
        alert('تم الحفظ');
      };
    }
  }

  // ---------- static text translation ----------
  function applyStaticI18n(){
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      el.innerHTML = t(key);
    });
  }

  // ---------- dispatcher ----------
  function renderApp(){
    applyLangDirection();
    renderTopbar();
    applyStaticI18n();
    if(isAdmin) renderAdminView();
    else renderPublicView();
  }

  // ---------- hidden admin trigger (اضغط 3 مرات على LA) ----------
  let laClickCount = 0, laClickTimer = null;
  document.getElementById('adminLA').onclick = () => {
    laClickCount++;
    clearTimeout(laClickTimer);
    laClickTimer = setTimeout(() => { laClickCount = 0; }, 900);
    if(laClickCount >= 3){
      laClickCount = 0;
      openModal('adminBackdrop');
    }
  };

  // ---------- modal helpers ----------
  function openModal(id){ document.getElementById(id).classList.add('open'); }
  function closeModal(id){
    document.getElementById(id).classList.remove('open');
    const err = document.getElementById(id).querySelector('.error');
    if(err) err.textContent = '';
  }
  document.getElementById('regCancel').onclick = () => closeModal('registerBackdrop');
  document.getElementById('logCancel').onclick = () => closeModal('loginBackdrop');
  document.getElementById('adminCancel').onclick = () => closeModal('adminBackdrop');
  document.getElementById('toLogin').onclick = () => { closeModal('registerBackdrop'); openModal('loginBackdrop'); };
  document.getElementById('toRegister').onclick = () => { closeModal('loginBackdrop'); openModal('registerBackdrop'); };
  ['registerBackdrop','loginBackdrop','adminBackdrop'].forEach(id => {
    document.getElementById(id).addEventListener('click', (e) => { if(e.target.id === id) closeModal(id); });
  });

  // ---------- settings drawer ----------
  document.getElementById('settingsBtn').onclick = () => {
    document.getElementById('settingsBackdrop').classList.add('open');
    document.getElementById('settingsDrawer').classList.add('open');
    document.querySelectorAll('.lang-options button').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  };
  function closeDrawer(){
    document.getElementById('settingsDrawer').classList.remove('open');
    setTimeout(() => document.getElementById('settingsBackdrop').classList.remove('open'), 300);
  }
  document.getElementById('settingsClose').onclick = closeDrawer;
  document.getElementById('settingsBackdrop').addEventListener('click', (e) => {
    if(e.target.id === 'settingsBackdrop') closeDrawer();
  });
  document.querySelectorAll('.lang-options button').forEach(btn => {
    btn.onclick = () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem('lhta-lang', currentLang);
      document.querySelectorAll('.lang-options button').forEach(b => b.classList.toggle('active', b === btn));
      renderApp();
    };
  });

  function persistUser(user){
    currentUser = user;
    localStorage.setItem('lhta-user', JSON.stringify(user));
  }

  // استرجاع جلسة المستخدم المحفوظة محليًا (إن وجدت)
  try{
    const savedUser = localStorage.getItem('lhta-user');
    if(savedUser) currentUser = JSON.parse(savedUser);
  }catch(e){}

  // ---------- تسجيل حساب جديد بالإيميل ----------
  document.getElementById('regSubmit').onclick = async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const pass = document.getElementById('regPass').value;
    const errEl = document.getElementById('regError');
    if(!name || !email || !pass){ errEl.textContent = 'عبّي كل الحقول من فضلك'; return; }
    const { ok, data } = await apiPost('/api/auth/register', { name, email, password: pass });
    if(!ok){ errEl.textContent = data.error || 'تعذر التسجيل، حاول مرة أخرى'; return; }
    persistUser(data.user);
    document.getElementById('regName').value = '';
    document.getElementById('regEmail').value = '';
    document.getElementById('regPass').value = '';
    closeModal('registerBackdrop');
    renderApp();
  };

  // ---------- تسجيل الدخول بالإيميل ----------
  document.getElementById('logSubmit').onclick = async () => {
    const email = document.getElementById('logEmail').value.trim().toLowerCase();
    const pass = document.getElementById('logPass').value;
    const errEl = document.getElementById('logError');
    const { ok, data } = await apiPost('/api/auth/login', { email, password: pass });
    if(!ok){ errEl.textContent = data.error || 'الإيميل أو كلمة المرور غير صحيحة'; return; }
    persistUser(data.user);
    document.getElementById('logEmail').value = '';
    document.getElementById('logPass').value = '';
    closeModal('loginBackdrop');
    renderApp();
  };

  // ---------- دخول المشرف (حقيقي عبر الخادم) ----------
  document.getElementById('adminSubmit').onclick = async () => {
    const pass = document.getElementById('adminPass').value;
    const errEl = document.getElementById('adminError');
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pass })
    });
    if(!res.ok){ errEl.textContent = 'كلمة مرور غير صحيحة'; return; }
    adminPassword = pass;
    localStorage.setItem('lhta-admin-pass', pass);
    isAdmin = true;
    document.getElementById('adminPass').value = '';
    closeModal('adminBackdrop');
    renderApp();
  };

  renderApp();
</script>

</body>
</html>
